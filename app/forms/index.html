    <style>
      body {
        padding-bottom: 64px;
      }
      header.bar {
        background: linear-gradient(135deg, var(--pine-a), var(--pine-b));
        color: var(--hero-ink);
        padding: 26px 0 0;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
      }
      header.bar h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      header.bar .sub {
        font-size: 0.85rem;
        color: var(--hero-sub);
        margin-top: 4px;
      }
      header.bar .who {
        font-size: 0.78rem;
        color: var(--hero-sub);
        margin-top: 10px;
      }

      .searchbar {
        margin: 22px 0 0;
        padding-bottom: 22px;
      }
      .searchbar input {
        font: inherit;
        font-size: 0.95rem;
        width: 100%;
        padding: 12px 16px;
        border-radius: var(--radius-input);
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.1);
        color: var(--hero-ink);
      }
      .searchbar input::placeholder {
        color: var(--hero-sub);
      }
      .searchbar input:focus {
        outline: none;
        border-color: var(--amber);
        background: rgba(255, 255, 255, 0.16);
      }

      .jump {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 20px 0 0;
      }
      .jump a {
        font-size: 0.78rem;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink-soft);
        border: 1px solid var(--line);
        padding: 6px 12px;
        border-radius: 999px;
      }
      .jump a:hover {
        border-color: var(--amber);
        color: var(--amber);
      }
      .jump .n {
        font-family: var(--font-mono);
        opacity: 0.6;
        margin-left: 4px;
      }

      section.block {
        margin-top: 30px;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .head h2 {
        margin: 0;
        font-size: 1rem;
        color: var(--pine);
      }
      .head .sub {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
        gap: 12px;
      }
      a.card {
        display: block;
        text-decoration: none;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 15px 18px;
      }
      a.card:hover {
        border-color: var(--amber);
      }
      a.card .code {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--amber);
        letter-spacing: 0.04em;
      }
      a.card .name {
        font-size: 0.92rem;
        color: var(--ink);
        margin-top: 5px;
        font-weight: 600;
        line-height: 1.3;
      }
      a.card .desc {
        font-size: 0.76rem;
        color: var(--ink-soft);
        margin-top: 5px;
        line-height: 1.4;
      }

      .empty {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: var(--radius-card);
        padding: 40px 24px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }
      button.primary {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: var(--amber);
        color: #fff;
        padding: 11px 24px;
        border-radius: var(--radius-input);
      }
      .gate {
        padding: 60px 0;
        text-align: center;
        color: var(--ink-soft);
      }
      .note {
        font-size: 0.78rem;
        color: var(--ink-soft);
        margin-top: 26px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>

          subtitle: "Governance and review forms",
          items: [
            {
              page: "CF001",
              search: "CF001 council mom",
              code: "CF 001",
              name: "Council MOM",
              desc: "Council meeting minutes",
            },
            {
              page: "CF002",
              search: "CF002 half yearly council performance reporting",
              code: "CF 002",
              name: "Half Yearly Council Performance Reporting",
              desc: "Council performance reporting",
            },
          ],
        },
      ];

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s === undefined || s === null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      function cardHtml(item) {
        return `
    <a class="card" href="${SCRIPT_URL}?page=${encodeURIComponent(item.page)}"
       target="_blank" rel="noopener"
       data-search="${esc((item.code + " " + item.name + " " + item.desc + " " + item.search).toLowerCase())}">
      <div class="code">${esc(item.code)}</div>
      <div class="name">${esc(item.name)}</div>
      <div class="desc">${esc(item.desc)}</div>
    </a>`;
      }

      function render() {
        $("jump").innerHTML = FORMS.map(
          (s) =>
            `<a href="#${s.id}">${esc(s.title.replace(/ Forms$/, ""))}<span class="n">${s.items.length}</span></a>`,
        ).join("");

        $("sections").innerHTML = FORMS.map(
          (s) => `
    <section class="block" id="${s.id}">
      <div class="head">
        <h2>${esc(s.title)}</h2>
        <span class="sub">${esc(s.subtitle)}</span>
      </div>
      <div class="grid">${s.items.map(cardHtml).join("")}</div>
    </section>`,
        ).join("");

        const total = FORMS.reduce((t, s) => t + s.items.length, 0);
        $("foot").textContent =
          `${total} forms. These open in the existing forms system in a new tab. ` +
          `If a form does not open, it is an access setting on that system rather ` +
          `than on this page.`;
      }

      // Search hides cards as you type, and hides a whole section once none of its
      // cards match, so the page does not leave empty headings behind.
      function filter(term) {
        const q = term.trim().toLowerCase();
        for (const section of document.querySelectorAll("section.block")) {
          let shown = 0;
          for (const card of section.querySelectorAll("a.card")) {
            const hit = !q || card.dataset.search.includes(q);
            card.classList.toggle("hidden", !hit);
            if (hit) shown++;
          }
          section.classList.toggle("hidden", shown === 0);
        }
        const anyShown = document.querySelectorAll(
          "a.card:not(.hidden)",
        ).length;
        let empty = document.getElementById("no-match");
        if (!anyShown && !empty) {
          empty = document.createElement("div");
          empty.id = "no-match";
          empty.className = "empty";
          empty.textContent =
            "Nothing matches that. Try a form code, or a word from its name.";
          $("sections").appendChild(empty);
        } else if (anyShown && empty) {
          empty.remove();
        }
      }

      async function start() {
        await initAuth();

        if (!getAccount()) {
          $("who").textContent = "Not signed in";
          const g = $("gate");
          g.classList.remove("hidden");
          g.innerHTML =
            "<p>Sign in with your Perfact account to see the forms.</p>";
          const b = document.createElement("button");
          b.className = "primary";
          b.textContent = "Sign in";
          b.onclick = () => signIn();
          g.appendChild(b);
          return;
        }

        // Any perfactgroup.in account may see this page. There is no role check:
        // it is a directory of links, and the forms behind it apply their own rules.
        const acct = getAccount();
        $("who").textContent = `${acct.name || acct.username}`;
        $("content").classList.remove("hidden");
        $("q").disabled = false;

        render();
        $("q").addEventListener("input", (e) => filter(e.target.value));

        if (SCRIPT_URL.startsWith("PASTE_")) {
          $("foot").textContent =
            "The forms system address has not been set yet, so these links will not " +
            "work. Set SCRIPT_URL at the top of this page.";
        }
      }

      start();
    </script>
  </body>
</html>
