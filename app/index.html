<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfact Intranet</title>
    <link rel="stylesheet" href="/assets/tokens.css" />
    <style>
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 {
        color: var(--pine);
        font-size: 2rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--ink-soft);
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        padding: 10px 20px;
        border-radius: var(--radius-input);
        border: none;
        background: var(--amber);
        color: #fff;
      }
      button:hover {
        background: var(--amber-deep);
      }
      button.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 24px;
        margin-top: 24px;
      }
      .who {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--pine);
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Perfact Intranet</h1>
      <p>BD Pipeline application. Build in progress.</p>

      <div id="signed-out">
        <button id="btn-signin">Sign in with your Perfact account</button>
      </div>

      <div id="signed-in" class="hidden">
        <div class="card">
          <div class="who" id="who"></div>
          <p id="detail"></p>
          <button class="secondary" id="btn-signout">Sign out</button>
        </div>
      </div>
    </main>

    <script src="/lib/vendor/msal-browser.min.js"></script>
    <script type="module">
      import { initAuth, signIn, signOut, getAccount } from "/lib/auth.js";
      import { api } from "/lib/api.js";

      const outEl = document.getElementById("signed-out");
      const inEl = document.getElementById("signed-in");

      function render() {
        const acct = getAccount();
        if (acct) {
          outEl.classList.add("hidden");
          inEl.classList.remove("hidden");
          document.getElementById("who").textContent = acct.username;
          document.getElementById("detail").textContent =
            "Signed in as " + (acct.name || "unknown");
        } else {
          outEl.classList.remove("hidden");
          inEl.classList.add("hidden");
        }
      }

      document.getElementById("btn-signin").onclick = () => signIn();
      document.getElementById("btn-signout").onclick = () => signOut();

      // Order matters. Sign-in must be established before any API call,
      // because getToken() needs an account to work with.
      await initAuth();
      render();

      if (getAccount()) {
        try {
          const health = await api.get("health");
          document.getElementById("detail").textContent =
            "API says: " + JSON.stringify(health);
        } catch (err) {
          document.getElementById("detail").textContent =
            "API call failed: " + err.message;
        }
      }
    </script>
  </body>
</html>
