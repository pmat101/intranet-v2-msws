<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project, Perfact Intranet</title>
    <link rel="stylesheet" href="/assets/tokens.css" />

    <style>
      body {
        padding-bottom: 64px;
      }

      header.bar {
        background: linear-gradient(135deg, var(--pine-a), var(--pine-b));
        color: var(--hero-ink);
        padding: 20px 0 24px;
      }

      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header.bar h1 {
        margin: 10px 0 2px;
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-mono);
      }

      header.bar .name {
        font-size: 0.95rem;
        color: var(--hero-ink);
      }

      header.bar .sub {
        font-size: 0.78rem;
        color: var(--hero-sub);
        margin-top: 6px;
      }

      .ribbon {
        display: flex;
        gap: 3px;
        margin-top: 18px;
      }

      .stop {
        flex: 1;
        padding: 7px 8px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.66rem;
        color: var(--hero-sub);
        text-align: center;
        line-height: 1.25;
      }

      .stop.past {
        background: rgba(255, 255, 255, 0.2);
        color: var(--hero-ink);
      }

      .stop.now {
        background: var(--amber);
        color: #fff;
        font-weight: 600;
      }

      .cols {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }

      @media (max-width: 820px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 18px 22px;
        margin-bottom: 16px;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 0.8rem;
        color: var(--pine);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .step {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }

      .step:last-child {
        border-bottom: none;
      }

      .tick {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        margin-top: 1px;
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        color: transparent;
      }

      .step.done .tick {
        background: var(--moss);
        border-color: var(--moss);
        color: #fff;
      }

      .step.skip .tick {
        border-style: dashed;
      }

      .step-label {
        font-size: 0.88rem;
        color: var(--ink);
        font-weight: 600;
      }

      .step.pending .step-label {
        color: var(--ink-soft);
        font-weight: 400;
      }

      .step-detail {
        font-size: 0.76rem;
        color: var(--ink-soft);
        margin-top: 3px;
      }

      .step-when {
        font-size: 0.72rem;
        color: var(--ink-soft);
        white-space: nowrap;
        font-family: var(--font-mono);
      }

      .money {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px 14px;
        font-size: 0.84rem;
      }

      .money dt {
        color: var(--ink-soft);
      }

      .money dd {
        margin: 0;
        font-family: var(--font-mono);
        text-align: right;
        color: var(--ink);
      }

      .money dd.big {
        font-size: 1rem;
        color: var(--pine);
      }

      .finding {
        border-left: 3px solid var(--line);
        padding: 8px 0 8px 12px;
        margin-bottom: 10px;
        font-size: 0.8rem;
      }

      .finding.high {
        border-color: var(--danger);
      }

      .finding.medium {
        border-color: var(--amber);
      }

      .finding.low {
        border-color: var(--river);
      }

      .finding .sev {
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
      }

      .clean {
        font-size: 0.84rem;
        color: var(--moss);
      }

      .idblock {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
        font-size: 0.8rem;
      }

      .idblock dt {
        color: var(--ink-soft);
      }

      .idblock dd {
        margin: 0;
        font-family: var(--font-mono);
        color: var(--ink);
      }

      .next {
        background: var(--amber-soft);
        border: 1px solid var(--amber);
        border-radius: var(--radius-card);
        padding: 18px 22px;
        margin-bottom: 16px;
      }

      .next h2 {
        margin: 0 0 8px;
        font-size: 0.8rem;
        color: var(--amber-deep);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .next p {
        margin: 0 0 12px;
        font-size: 0.85rem;
        color: var(--ink);
      }

      .next a {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 600;
        background: var(--amber);
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: var(--radius-input);
      }

      .next a:hover {
        background: var(--amber-deep);
      }

      table.led {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }

      table.led th {
        text-align: left;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        padding-bottom: 6px;
      }

      table.led td {
        padding: 5px 0;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
      }

      table.led td.src {
        font-family: var(--font-body);
        color: var(--ink-soft);
      }

      table.led td.amt {
        text-align: right;
      }

      .empty {
        color: var(--ink-soft);
        font-size: 0.85rem;
      }

      .loading {
        padding: 48px 0;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      .hidden {
        display: none;
      }
      .danger-zone {
        margin-top: 16px;
        text-align: right;
      }
      .danger-zone button {
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        padding: 7px 14px;
        border-radius: var(--radius-input);
      }
      .danger-zone button:hover {
        border-color: var(--danger);
        color: var(--danger);
      }

      .modal-back {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 50;
      }
      .modal {
        background: var(--card);
        border-radius: var(--radius-card);
        padding: 26px 28px;
        max-width: 520px;
        width: 100%;
        border: 1px solid var(--line);
      }
      .modal h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
        color: var(--danger);
      }
      .modal .lead {
        font-size: 0.84rem;
        color: var(--ink-soft);
        margin: 0 0 18px;
      }
      .modal label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-soft);
        margin: 14px 0 6px;
      }
      .modal label .req {
        color: var(--amber);
      }
      .modal select,
      .modal input,
      .modal textarea {
        font: inherit;
        font-size: 0.88rem;
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-input);
        background: var(--bg);
        color: var(--ink);
      }
      .modal .row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 22px;
      }
      .modal .cancel {
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 10px 18px;
        border-radius: var(--radius-input);
      }
      .modal .confirm {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--danger);
        border: none;
        color: #fff;
        padding: 10px 18px;
        border-radius: var(--radius-input);
      }
      .modal .err {
        font-size: 0.78rem;
        color: var(--danger);
        min-height: 1em;
        margin-top: 10px;
      }
      .doc {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 14px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .doc:last-of-type {
        border-bottom: none;
      }
      .doc a {
        font-size: 0.84rem;
        color: var(--pine);
        text-decoration: none;
      }
      .doc a:hover {
        text-decoration: underline;
      }
      .doc .dmeta {
        font-size: 0.72rem;
        color: var(--ink-soft);
        margin-top: 2px;
      }
      .doc .dtype {
        font-size: 0.66rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
      }

      .upload {
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .upload .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .upload select,
      .upload input[type="text"] {
        font: inherit;
        font-size: 0.84rem;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-input);
        background: var(--bg);
        color: var(--ink);
      }
      .upload input[type="file"] {
        font: inherit;
        font-size: 0.8rem;
        width: 100%;
        color: var(--ink-soft);
      }
      .upload .go {
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--amber);
        border: none;
        color: #fff;
        padding: 9px 18px;
        border-radius: var(--radius-input);
        margin-top: 10px;
      }
      .upload .go:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .upload .note {
        font-size: 0.72rem;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .upload .err {
        font-size: 0.78rem;
        color: var(--danger);
        min-height: 1em;
        margin-top: 8px;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="wrap">
        <h1 id="h-pcode">&nbsp;</h1>
        <div class="name" id="h-name"></div>
        <div class="sub" id="h-sub"></div>
        <div class="ribbon" id="ribbon"></div>
      </div>
    </header>

    <main class="wrap">
      <div class="loading" id="loading">Loading the project...</div>

      <div id="content" class="hidden">
        <div id="next-wrap"></div>

        <div class="danger-zone" id="danger-zone"></div>

        <div class="cols">
          <div>
            <div class="panel">
              <h2>The chain</h2>
              <div id="steps"></div>
            </div>

            <div class="panel">
              <h2>Ledger entries</h2>
              <div id="ledger"></div>
            </div>
          </div>

          <div>
            <div class="panel">
              <h2>Money</h2>
              <dl class="money" id="money"></dl>
            </div>

            <div class="panel">
              <h2>Reconciliation</h2>
              <div id="findings"></div>
            </div>

            <div class="panel">
              <h2>Identity</h2>
              <dl class="idblock" id="ids"></dl>
            </div>
            <div class="panel">
              <h2>Documents</h2>
              <div id="documents"></div>
              <div class="upload" id="upload-box"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/lib/vendor/msal-browser.min.js"></script>

    <script type="module">
      import { initAuth, signIn, getAccount } from "/lib/auth.js";
      import { api } from "/lib/api.js";
      import { formatRupees } from "/lib/money.js";

      const $ = (id) => document.getElementById(id);

      const esc = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      const pcode = new URLSearchParams(location.search).get("pcode") || "";

      function shortDate(iso) {
        if (!iso) return "";

        const date = new Date(iso);

        if (Number.isNaN(date.getTime())) return "";

        return date.toLocaleDateString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      function renderRibbon(stages, currentIndex) {
        $("ribbon").innerHTML = stages
          .map((stage, index) => {
            const className =
              index < currentIndex
                ? "past"
                : index === currentIndex
                  ? "now"
                  : "";

            return `
              <div class="stop ${className}">
                ${esc(stage)}
              </div>
            `;
          })
          .join("");
      }

      function renderSteps(list) {
        $("steps").innerHTML = list
          .map((step) => {
            const className = step.done ? "done" : "pending";

            return `
              <div class="step ${className}">
                <span class="tick">&#10003;</span>

                <div>
                  <div class="step-label">
                    ${esc(step.label)}
                  </div>

                  ${
                    step.detail
                      ? `<div class="step-detail">${esc(step.detail)}</div>`
                      : ""
                  }
                </div>

                <span class="step-when">
                  ${shortDate(step.at)}
                </span>
              </div>
            `;
          })
          .join("");
      }

      function renderMoney(ledger) {
        if (!ledger) {
          $("money").innerHTML =
            `<dt class="empty">No ledger yet</dt><dd></dd>`;
          return;
        }

        const row = (label, amount, big = false) =>
          `<dt>${label}</dt><dd${big ? ' class="big"' : ""}>${formatRupees(amount)}</dd>`;

        $("money").innerHTML =
          row("Work order", ledger.committed, true) +
          row("Scheduled in milestones", ledger.scheduled) +
          row("Billable per delivery", ledger.billable) +
          row("Invoiced", ledger.invoiced) +
          row("Received", ledger.received) +
          row("Outstanding", ledger.outstanding) +
          row("Not yet billed", ledger.unbilled);
      }

      function renderFindings(ledger) {
        if (!ledger) {
          $("findings").innerHTML =
            `<div class="empty">Nothing to reconcile yet.</div>`;
          return;
        }

        if (ledger.clean) {
          $("findings").innerHTML =
            `<div class="clean">The two halves of the ledger agree. Nothing to look at.</div>`;
          return;
        }

        $("findings").innerHTML = ledger.findings
          .map(
            (finding) => `
              <div class="finding ${esc(finding.severity)}">
                <div class="sev">${esc(finding.severity)}</div>
                ${esc(finding.message)}
              </div>
            `,
          )
          .join("");
      }

      function renderLedger(rows) {
        if (!rows?.length) {
          $("ledger").innerHTML =
            `<div class="empty">No ledger entries yet.</div>`;
          return;
        }

        $("ledger").innerHTML = `
          <table class="led">
            <thead>
              <tr>
                <th>Entry</th>
                <th>Source</th>
                <th>Date</th>
                <th style="text-align:right">Amount</th>
              </tr>
            </thead>

            <tbody>
              ${rows
                .map(
                  (row) => `
                    <tr>
                      <td>${esc(row.entryId)}</td>
                      <td class="src">${esc(row.source)}</td>
                      <td>${shortDate(row.dateIso)}</td>
                      <td class="amt">${formatRupees(row.amount)}</td>
                    </tr>
                  `,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function renderNextAction(d) {
        const n = d.next;
        if (!n) {
          $("next-wrap").innerHTML = "";
          return;
        }
        // The sent step has no form, because it writes one field. It gets a
        // button here rather than a page of its own.
        const link = n.href
          ? `<a href="${n.href}?pcode=${encodeURIComponent(d.pcode)}">${esc(n.label)}</a>`
          : n.forStep === "sent"
            ? `<a href="#" id="btn-sent">Mark as sent to the client</a>`
            : "";
        $("next-wrap").innerHTML = `
        <div class="next">
          <h2>Next</h2>
          <p>${esc(n.label)}${n.note ? ". " + esc(n.note) : ""}</p>
          ${link}
        </div>`;

        // Wired here rather than in load(), because the element only exists
        // once the markup above has been written.
        const btn = document.getElementById("btn-sent");
        if (btn) {
          btn.onclick = async (e) => {
            e.preventDefault();
            btn.textContent = "Recording...";
            try {
              await api.post("proposal/sent", { pcode: d.pcode });
              location.reload();
            } catch (err) {
              btn.textContent = err.message || "That did not work";
            }
          };
        }
      }

      const LOSS_REASONS = [
        ["PriceTooHigh", "Our price was too high"],
        ["LostToCompetitor", "Lost to a competitor"],
        ["ClientDeferred", "Client deferred the project"],
        ["ClientWithdrew", "Client withdrew entirely"],
        ["TechnicalDecline", "We declined on technical grounds"],
        ["ScopeMismatch", "Scope did not match what we do"],
        ["NoResponse", "Client stopped responding"],
        ["Other", "Something else"],
      ];

      /**
       * The Lost action. Deliberately quiet in appearance and behind a
       * confirmation, because it is terminal: a lost project leaves the working
       * list and does not come back. But it is also the answer to the question in
       * the Tier 3 note, why a thousand leads went nowhere, so a category and a
       * sentence are both required.
       */
      function renderDangerZone(d) {
        const zone = $("danger-zone");
        if (d.status !== "Active") {
          zone.innerHTML = "";
          return;
        }
        zone.innerHTML = `<button type="button" id="btn-lost">Mark this project as lost</button>`;
        document.getElementById("btn-lost").onclick = () => openLostModal(d);
      }

      function openLostModal(d) {
        const back = document.createElement("div");
        back.className = "modal-back";
        back.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h2>Mark ${esc(d.pcode)} as lost</h2>
          <p class="lead">This is final. The project leaves the working list.
             It will be recorded as lost at <strong>${esc(d.stage)}</strong>,
             which is how we learn where in the funnel we lose work.</p>

          <label for="m-cat">Why was it lost<span class="req">*</span></label>
          <select id="m-cat">
            <option value="">Select</option>
            ${LOSS_REASONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}
          </select>

          <div id="m-comp-wrap" style="display:none">
            <label for="m-comp">Which competitor<span class="req">*</span></label>
            <input type="text" id="m-comp">
          </div>

          <label for="m-reason">What happened<span class="req">*</span></label>
          <textarea id="m-reason" rows="3"
            placeholder="One or two sentences. This is what the win and loss analysis is built from."></textarea>

          <label for="m-date">Date it was lost</label>
          <input type="date" id="m-date" value="${new Date().toISOString().slice(0, 10)}">

          <label for="m-cost">Cost incurred so far, in lakh</label>
          <input type="text" id="m-cost" inputmode="decimal" placeholder="0">

          <div class="err" id="m-err"></div>
          <div class="row">
            <button type="button" class="cancel" id="m-cancel">Keep it active</button>
            <button type="button" class="confirm" id="m-confirm">Mark as lost</button>
          </div>
        </div>`;
        document.body.appendChild(back);

        const close = () => back.remove();
        document.getElementById("m-cancel").onclick = close;
        back.onclick = (e) => {
          if (e.target === back) close();
        };

        // The competitor name only matters for one reason, so it appears only
        // then rather than sitting empty on every other loss.
        document.getElementById("m-cat").onchange = (e) => {
          document.getElementById("m-comp-wrap").style.display =
            e.target.value === "LostToCompetitor" ? "block" : "none";
        };

        document.getElementById("m-confirm").onclick = async () => {
          const err = document.getElementById("m-err");
          const cat = document.getElementById("m-cat").value;
          const reason = document.getElementById("m-reason").value.trim();
          const comp = document.getElementById("m-comp").value.trim();

          if (!cat) {
            err.textContent = "Choose why it was lost.";
            return;
          }
          if (!reason) {
            err.textContent = "Say in a sentence what happened.";
            return;
          }
          if (cat === "LostToCompetitor" && !comp) {
            err.textContent = "Name the competitor.";
            return;
          }

          const lakhText = document.getElementById("m-cost").value.trim();
          const costPaise = lakhText
            ? Math.round(Number(lakhText.replace(/,/g, "")) * 10000000)
            : 0;

          const btn = document.getElementById("m-confirm");
          btn.disabled = true;
          btn.textContent = "Recording...";
          try {
            await api.post("lost", {
              pcode: d.pcode,
              reasonCategory: cat,
              reason,
              competitorName: comp,
              lostDate: document.getElementById("m-date").value,
              costIncurred: Number.isFinite(costPaise) ? costPaise : 0,
            });
            location.reload();
          } catch (e) {
            btn.disabled = false;
            btn.textContent = "Mark as lost";
            err.textContent = e.message || "That did not work.";
          }
        };
      }

      const DOC_TYPES = [
        ["Proposal", "Proposal"],
        ["ClientConfirmation", "Client confirmation"],
        ["PurchaseOrder", "Purchase order"],
        ["WorkOrder", "Work order"],
        ["Correspondence", "Correspondence"],
        ["Other", "Other"],
      ];

      async function renderDocuments(pcode) {
        let d;
        try {
          d = await api.get("documents?pcode=" + encodeURIComponent(pcode));
        } catch (err) {
          $("documents").innerHTML =
            `<div class="empty">Documents could not be loaded.</div>`;
          return;
        }

        $("documents").innerHTML = d.rows.length
          ? d.rows
              .map(
                (r) => `
            <div class="doc">
              <div>
                <div class="dtype">${esc(r.documentType)}</div>
                <a href="${esc(r.fileUrl)}" target="_blank" rel="noopener">
                  ${esc(r.label || r.fileName)}</a>
                <div class="dmeta">${esc(r.uploadedBy)} &middot; ${shortDate(r.uploadedAt)}
                  ${r.sizeKb ? " &middot; " + r.sizeKb + " KB" : ""}</div>
              </div>
            </div>`,
              )
              .join("")
          : `<div class="empty" style="padding:20px">Nothing uploaded yet.</div>`;
      }

      /**
       * The upload posts raw bytes rather than JSON, because a PDF is binary and
       * base64 inside JSON would inflate it by a third. Metadata therefore goes
       * in the query string. This is the only call in the app shaped this way.
       */
      function renderUpload(pcode) {
        $("upload-box").innerHTML = `
        <div class="row">
          <select id="u-type">
            ${DOC_TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}
          </select>
          <input type="text" id="u-label" placeholder="Label, for instance Round 2">
        </div>
        <input type="file" id="u-file" accept=".pdf,.png,.jpg,.jpeg">
        <button type="button" class="go" id="u-go">Upload</button>
        <div class="note">PDF, PNG or JPEG, up to 4 MB.</div>
        <div class="err" id="u-err"></div>`;

        const go = document.getElementById("u-go");
        go.onclick = async () => {
          const err = document.getElementById("u-err");
          const input = document.getElementById("u-file");
          const file = input.files && input.files[0];
          err.textContent = "";

          if (!file) {
            err.textContent = "Choose a file first.";
            return;
          }
          if (file.size > 4 * 1024 * 1024) {
            err.textContent = `That file is ${(file.size / 1048576).toFixed(1)} MB. The limit is 4 MB.`;
            return;
          }

          go.disabled = true;
          go.textContent = "Uploading...";
          try {
            const params = new URLSearchParams({
              pcode,
              type: document.getElementById("u-type").value,
              label: document.getElementById("u-label").value.trim(),
              filename: file.name,
            });
            await api.postBinary("documents/upload?" + params.toString(), file);
            await renderDocuments(pcode);
            input.value = "";
            document.getElementById("u-label").value = "";
          } catch (e) {
            err.textContent = e.message || "That did not upload.";
          } finally {
            go.disabled = false;
            go.textContent = "Upload";
          }
        };
      }

      async function loadProject() {
        const data = await api.get(
          "pipeline/project?pcode=" + encodeURIComponent(pcode),
        );

        $("h-pcode").textContent = data.pcode;
        $("h-name").textContent = data.projectName || "unnamed";

        $("h-sub").textContent =
          `${data.stage} for ${
            data.daysInStage === null ? "?" : data.daysInStage
          } days` + `  ·  ${data.status}  ·  ${data.owner || ""}`;

        renderRibbon(data.stages, data.stageIndex);
        renderSteps(data.steps || []);
        renderNextAction(data);
        renderDangerZone(data);
        renderMoney(data.ledger);
        renderFindings(data.ledger);
        renderLedger(data.ledgerRows);
        renderDocuments(data.pcode);
        renderUpload(data.pcode);

        $("ids").innerHTML = `
          <dt>Proposal ID</dt>
          <dd>${esc(data.proposalId)}</dd>

          <dt>Client group</dt>
          <dd>${esc(data.group)}</dd>

          <dt>Customer</dt>
          <dd>${esc(data.customer)}</dd>

          <dt>Lead date</dt>
          <dd>${shortDate(data.leadDate)}</dd>

          <dt>Proposals</dt>
          <dd>${data.counts.proposals}</dd>

          <dt>Milestones</dt>
          <dd>${data.counts.milestones}</dd>
        `;

        $("loading").classList.add("hidden");
        $("content").classList.remove("hidden");
      }

      async function start() {
        if (!pcode) {
          $("loading").innerHTML =
            `No P-Code given. <a href="/">Back to the pipeline</a>.`;
          return;
        }

        await initAuth();

        if (!getAccount()) {
          $("loading").innerHTML = "You need to sign in. ";

          const button = document.createElement("button");
          button.textContent = "Sign in";
          button.onclick = () => signIn();

          $("loading").appendChild(button);
          return;
        }

        try {
          await loadProject();
        } catch (error) {
          $("loading").textContent =
            error.message || "The project could not be loaded.";
        }
      }

      start();
    </script>

    <script src="/lib/navigation.js"></script>
  </body>
</html>
