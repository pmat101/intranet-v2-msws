<body>
<div class="form-wrapper">

// Income
renderField(c,{ label:"Annual Average Income (₹)", id:"income_avg" });

// Farmer Category

// Awareness

// Problems / Suggestions
renderField(c,{ label:"5 Most Important Problems/Gaps", id:"problems" });
renderField(c,{ label:"Suggestions (if any)", id:"suggestions" });

// ---------------- MULTIPLE ENTRY: Nearby Industries ----------------
document.getElementById("addIndustryBtn").addEventListener("click",()=>{
  const container = document.getElementById("industriesBody");
  const row = document.createElement("div");
  row.className = "subform-row";
  row.innerHTML = `
    <input type="text" placeholder="Industry Name" class="industry_name" style="margin-right:4px" />
    <input type="text" placeholder="Distance" class="industry_distance" style="margin-right:4px" />
    <input type="text" placeholder="Direction" class="industry_direction" style="margin-right:4px" />
    <input type="number" placeholder="No. of Workers" class="industry_workers" style="margin-right:4px" />
    <button type="button" class="btn-secondary btn-sm removeIndustryBtn">Remove</button>
  `;
  container.appendChild(row);

  row.querySelector(".removeIndustryBtn").addEventListener("click",()=>row.remove());
});

function collectIndustries() {
  const rows = Array.from(document.querySelectorAll("#industriesBody .subform-row"));
  return rows.map(r=>({
    name: r.querySelector(".industry_name")?.value || "",
    distance: r.querySelector(".industry_distance")?.value || "",
    direction: r.querySelector(".industry_direction")?.value || "",
    workers: r.querySelector(".industry_workers")?.value || ""
  })).filter(x => x.name);
}

// ---------------- SUBMIT ----------------
document.getElementById("submitBtn").addEventListener("click",()=>{
  const payload = {};
  document.querySelectorAll("#f_fields input, #f_fields select, #f_fields textarea").forEach(el=>{
    if(el.id) payload[el.id] = el.value;
  });
  payload.nearby_industries = collectIndustries();

  google.script.run
    .withSuccessHandler(res=>document.getElementById("status").innerText="SF01 submitted successfully")
    .withFailureHandler(err=>document.getElementById("status").innerText="Submit failed: "+err.message)
    .submitForm(FORM_CODE, payload);
});
</script>
</body>
