<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_top" />
    <title>ADM07 - Vendor Approval / Re-Approval Form</title>
    <?!= HtmlService.createHtmlOutputFromFile('sharedStyles').getContent(); ?>
    <?!= HtmlService.createHtmlOutputFromFile('sharedComponents').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">ADM07 - Vendor Approval / Re-Approval Form</div>
      <div class="form-subtitle">Submit vendor approval or re-approval details</div>

      <div id="f_fields"></div>

      <div style="margin-top: 20px">
        <button class="btn-primary" id="submitBtn">Submit</button>
        <span id="status" class="text-muted" style="margin-left: 12px"></span>
      </div>
    </div>

    <script>
      const FORM_CODE = "adm07";
      const c = document.getElementById("f_fields");

      // Main fields
      renderField(c, { label: "First Name", id: "first_name" });
      renderField(c, { label: "Last Name", id: "last_name" });
      renderField(c, { label: "Email *", id: "email", type: "email" });
      renderField(c, { label: "E Code of the Requestor *", id: "ecode" });
      renderField(c, { label: "Date", id: "date", type: "date", placeholder: "dd-MMM-yyyy" });
      renderField(c, { label: "Department *", id: "department" });

      // Vendor details
      renderField(c, { label: "Vendor First Name", id: "vendor_first_name" });
      renderField(c, { label: "Vendor Last Name", id: "vendor_last_name" });
      renderField(c, { label: "Vendor Company Name", id: "vendor_company" });
      renderField(c, { label: "Vendor Code", id: "vendor_code" });
      renderField(c, { label: "Type of Vendor *", id: "vendor_type" });
      renderField(c, { label: "Status of Vendor *", id: "vendor_status" });
      renderField(c, { label: "Approved Vendor / New Vendor", id: "approved_status", type: "select", options: ["Approved Vendor", "New Vendor"] });
      renderField(c, { label: "Rating", id: "rating" });
      renderField(c, { label: "Approve vendor for next quarter *", id: "approve_next_quarter", type: "select", options: ["Yes", "No - need a new vendor"] });
      renderField(c, { label: "Comments of the Reviewer *", id: "reviewer_comments", type: "textarea" });
      renderField(c, { label: "Remarks (if any)", id: "remarks", type: "textarea" });

      // Submit handler
      document.getElementById("submitBtn").addEventListener("click", function () {
        const payload = {
          first_name: document.getElementById("first_name")?.value || "",
          last_name: document.getElementById("last_name")?.value || "",
          email: document.getElementById("email")?.value || "",
          ecode: document.getElementById("ecode")?.value || "",
          date: document.getElementById("date")?.value || "",
          department: document.getElementById("department")?.value || "",
          vendor_first_name: document.getElementById("vendor_first_name")?.value || "",
          vendor_last_name: document.getElementById("vendor_last_name")?.value || "",
          vendor_company: document.getElementById("vendor_company")?.value || "",
          vendor_code: document.getElementById("vendor_code")?.value || "",
          vendor_type: document.getElementById("vendor_type")?.value || "",
          vendor_status: document.getElementById("vendor_status")?.value || "",
          approved_status: document.getElementById("approved_status")?.value || "",
          rating: document.getElementById("rating")?.value || "",
          approve_next_quarter: document.getElementById("approve_next_quarter")?.value || "",
          reviewer_comments: document.getElementById("reviewer_comments")?.value || "",
          remarks: document.getElementById("remarks")?.value || ""
        };

        google.script.run
          .withSuccessHandler(res => {
            document.getElementById("status").innerText = "Submitted: " + (res.submission_id || "OK");
          })
          .withFailureHandler(err => {
            document.getElementById("status").innerText = "Submit failed: " + err.message;
          })
          .submitForm(FORM_CODE.toUpperCase(), payload);
      });
    </script>
  </body>
</html>
