<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Perfact Intranet, BD pipeline</title>
    <link rel="stylesheet" href="/assets/tokens.css" />

    <style>
      body {
        padding-bottom: 64px;
      }

      header.bar {
        background: linear-gradient(135deg, var(--pine-a), var(--pine-b));
        color: var(--hero-ink);
        padding: 22px 0 0;
      }

      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header.bar h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      .who {
        font-size: 0.8rem;
        color: var(--hero-sub);
        margin-top: 3px;
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-top: 18px;
      }

      .tab {
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        border: none;
        color: var(--hero-sub);
        padding: 10px 18px;
        border-radius: var(--radius-input) var(--radius-input) 0 0;
      }

      .tab:hover {
        color: var(--hero-ink);
      }

      .tab.active {
        background: var(--bg);
        color: var(--pine);
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .kpi {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 14px 18px;
      }

      .kpi .n {
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--pine);
        font-family: var(--font-mono);
      }

      .kpi .l {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-top: 4px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 26px 0 10px;
        gap: 16px;
        flex-wrap: wrap;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 1rem;
        color: var(--pine);
      }

      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .note {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .new-lead {
        font-size: 0.82rem;
        font-weight: 600;
        background: transparent;
        color: var(--amber);
        border: 1px solid var(--amber);
        text-decoration: none;
        padding: 8px 15px;
        border-radius: var(--radius-input);
      }

      .new-lead:hover {
        background: var(--amber);
        color: #fff;
      }

      button.link {
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
        background: none;
        border: none;
        color: var(--pine);
        text-decoration: underline;
        padding: 0;
      }

      .search-filter {
        display: flex;
        gap: 10px;
        margin: 14px 0 12px;
      }

      .search-box {
        flex: 1;
        position: relative;
      }

      .search-box input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        font-size: 0.82rem;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-input);
        padding: 10px 13px 10px 36px;
        outline: none;
      }

      .search-box input:focus,
      .sort-select:focus {
        border-color: var(--moss);
        box-shadow: 0 0 0 2px var(--moss-soft);
      }

      .search-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-soft);
        pointer-events: none;
      }

      .sort-select {
        font: inherit;
        font-size: 0.82rem;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-input);
        padding: 10px 12px;
        cursor: pointer;
        outline: none;
      }

      .results-note {
        font-size: 0.75rem;
        color: var(--ink-soft);
        margin-bottom: 10px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 16px 20px;
        margin-bottom: 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px 20px;
        align-items: center;
      }

      .card .head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pcode {
        font-family: var(--font-mono);
        font-size: 0.95rem;
        color: var(--pine);
        font-weight: 600;
        text-decoration: none;
      }

      .pname {
        font-size: 0.9rem;
        color: var(--ink);
      }

      .meta {
        font-size: 0.75rem;
        color: var(--ink-soft);
        margin-top: 5px;
      }

      .chip {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink-soft);
      }

      .chip.aged {
        border-color: var(--danger);
        color: var(--danger);
      }

      .chip.fresh {
        border-color: var(--moss);
        color: var(--moss);
        background: var(--moss-soft);
      }

      .dots {
        display: flex;
        gap: 4px;
        margin-top: 8px;
      }

      .dot {
        width: 22px;
        height: 5px;
        border-radius: 3px;
        background: var(--line);
      }

      .dot.done {
        background: var(--moss);
      }

      .dot.skip {
        background: transparent;
        border: 1px dashed var(--line);
        height: 3px;
      }

      .act {
        text-align: right;
      }

      .act a {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 600;
        background: var(--amber);
        color: #fff;
        text-decoration: none;
        padding: 9px 16px;
        border-radius: var(--radius-input);
      }

      .offline {
        font-size: 0.78rem;
        color: var(--ink-soft);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(6, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 22px;
        overflow-x: auto;
      }

      .col {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 12px;
        min-width: 150px;
      }

      .col h3 {
        margin: 0 0 4px;
        font-size: 0.74rem;
        color: var(--pine);
        text-transform: uppercase;
      }

      .count {
        font-family: var(--font-mono);
        font-size: 1.3rem;
        margin-bottom: 10px;
      }

      .mini {
        border-top: 1px solid var(--line);
        padding: 8px 0 6px;
      }

      .mini a {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--pine);
        text-decoration: none;
      }

      .mini .d {
        font-size: 0.7rem;
        color: var(--ink-soft);
      }

      .empty {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: var(--radius-card);
        padding: 40px 24px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      button.primary {
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: var(--amber);
        color: #fff;
        padding: 11px 24px;
        border-radius: var(--radius-input);
      }

      .hidden {
        display: none;
      }

      @media (max-width: 720px) {
        .card {
          grid-template-columns: 1fr;
        }

        .act {
          text-align: left;
        }

        .board {
          grid-template-columns: 1fr;
        }

        .search-filter {
          flex-direction: column;
        }

        .sort-select {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="wrap">
        <h1>BD pipeline</h1>
        <div class="who" id="who">Checking your access...</div>

        <div class="tabs">
          <button class="tab active" id="tab-work" type="button">
            What needs doing
          </button>

          <button class="tab" id="tab-board" type="button">
            Pipeline board
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div id="gate" style="padding: 40px 0" class="empty hidden"></div>

      <section id="view-work" class="hidden">
        <div class="kpis" id="kpis"></div>

        <div class="toolbar">
          <h2 id="work-title">Longest waiting first</h2>

          <div class="toolbar-right">
            <span class="note" id="scope-note"></span>

            <button
              class="link hidden"
              id="toggle-scope"
              type="button"
            ></button>

            <a class="new-lead" href="/leads/leads-new.html">
              New lead
            </a>
          </div>
        </div>

        <div class="search-filter">
          <label class="search-box">
            <span class="search-icon">⌕</span>

            <input
              id="project-search"
              type="search"
              placeholder="Search P-Code or client name..."
              autocomplete="off"
            />
          </label>

          <select id="sort-projects" class="sort-select">
            <option value="waiting">Longest waiting first</option>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="shortest">Shortest waiting first</option>
          </select>
        </div>

        <div class="results-note" id="results-note"></div>
        <div id="work-list"></div>
      </section>

      <section id="view-board" class="hidden">
        <div class="board" id="board"></div>
      </section>
    </main>

    <script src="/lib/vendor/msal-browser.min.js"></script>

    <script type="module">
      import { initAuth, signIn, getAccount } from "/lib/auth.js";
      import { api } from "/lib/api.js";

      const $ = (id) => document.getElementById(id);

      let showEveryone = false;
      let allWork = [];
      let currentSearch = "";
      let currentSort = "waiting";

      const esc = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      function dots(steps) {
        return `
          <div class="dots">
            ${steps
              .map((step) => {
                if (step.key === "qualification") {
                  return `<span class="dot skip" title="Qualification, handled offline"></span>`;
                }

                return `
                  <span
                    class="dot${step.done ? " done" : ""}"
                    title="${esc(step.label)}${step.done ? ", done" : ""}"
                  ></span>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function ageChip(days) {
        if (days === null || days === undefined) return "";

        if (days >= 15) {
          return `<span class="chip aged">${days} days in stage</span>`;
        }

        if (days <= 2) {
          return `<span class="chip fresh">${days} days in stage</span>`;
        }

        return `<span class="chip">${days} days in stage</span>`;
      }

      function workCard(w) {
        const next = w.next;

        const action = !next
          ? `<span class="offline">Nothing outstanding</span>`
          : next.href
            ? `<a href="${next.href}?pcode=${encodeURIComponent(w.pcode)}">${esc(next.label)}</a>`
            : `<span class="offline">${esc(next.label)}<br>${esc(next.note || "")}</span>`;

        return `
          <div class="card">
            <div>
              <div class="head">
                <a
                  class="pcode"
                  href="/project.html?pcode=${encodeURIComponent(w.pcode)}"
                >
                  ${esc(w.pcode)}
                </a>

                <span class="pname">
                  ${esc(w.projectName) || "unnamed"}
                </span>

                ${ageChip(w.daysInStage)}
              </div>

              <div class="meta">
                ${esc(w.stage)}
                &middot; ${w.stepsDone} of ${w.stepCount} steps
                &middot; ${esc(w.owner || "")}
              </div>

              ${dots(w.steps || [])}
            </div>

            <div class="act">${action}</div>
          </div>
        `;
      }

      function searchValue(w) {
        return [
          w.pcode,
          w.projectName,
          w.clientName,
          w.customerName,
          w.customer,
          w.client,
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
      }

      function projectDate(w) {
        const value =
          w.leadDate ||
          w.createdAt ||
          w.createdDate ||
          w.updatedAt ||
          w.date;

        if (!value) return 0;

        const time = new Date(value).getTime();
        return Number.isNaN(time) ? 0 : time;
      }

      function sortWork(list) {
        const rows = [...list];

        if (currentSort === "waiting") {
          rows.sort(
            (a, b) =>
              (b.daysInStage ?? -1) -
              (a.daysInStage ?? -1)
          );
        }

        if (currentSort === "shortest") {
          rows.sort(
            (a, b) =>
              (a.daysInStage ?? Number.MAX_SAFE_INTEGER) -
              (b.daysInStage ?? Number.MAX_SAFE_INTEGER)
          );
        }

        if (currentSort === "newest") {
          rows.sort((a, b) => projectDate(b) - projectDate(a));
        }

        if (currentSort === "oldest") {
          rows.sort((a, b) => projectDate(a) - projectDate(b));
        }

        return rows;
      }

      function renderFilteredWork() {
        const query = currentSearch.trim().toLowerCase();

        const filtered = query
          ? allWork.filter((project) =>
              searchValue(project).includes(query)
            )
          : allWork;

        const rows = sortWork(filtered);

        $("results-note").textContent = query
          ? `Showing ${rows.length} of ${allWork.length} projects`
          : `${rows.length} projects`;

        if (!rows.length) {
          $("work-list").innerHTML = `
            <div class="empty">
              <p>No projects match your search.</p>
              <button class="primary" id="clear-search" type="button">
                Clear search
              </button>
            </div>
          `;

          $("clear-search").onclick = () => {
            $("project-search").value = "";
            currentSearch = "";
            renderFilteredWork();
          };

          return;
        }

        $("work-list").innerHTML = rows.map(workCard).join("");
      }

      async function renderWork() {
        const path =
          "pipeline/work" + (showEveryone ? "?all=1" : "");

        const d = await api.get(path);

        $("kpis").innerHTML = `
          <div class="kpi">
            <div class="n">${d.totals.active}</div>
            <div class="l">Active</div>
          </div>

          <div class="kpi">
            <div class="n">${d.totals.awaitingAction}</div>
            <div class="l">Awaiting action</div>
          </div>

          <div class="kpi">
            <div class="n">${d.totals.lost}</div>
            <div class="l">Lost</div>
          </div>

          <div class="kpi">
            <div class="n">${d.totals.closed}</div>
            <div class="l">Closed</div>
          </div>
        `;

        $("scope-note").textContent =
          d.scopedTo === "everyone"
            ? "Showing every project."
            : "Showing only your projects.";

        if (!d.canSeeEveryone) {
          const button = $("toggle-scope");

          button.classList.remove("hidden");
          button.textContent = showEveryone
            ? "Show only mine"
            : "Show everyone's";

          button.onclick = () => {
            showEveryone = !showEveryone;
            renderWork();
          };
        }

        allWork = d.work || [];
        renderFilteredWork();
      }

      async function renderBoard() {
        const d = await api.get("pipeline/board");

        $("board").innerHTML = d.stages
          .map((stage) => {
            const rows = d.byStage[stage] || [];

            return `
              <div class="col">
                <h3>${esc(stage)}</h3>
                <div class="count">${rows.length}</div>

                ${rows
                  .slice(0, 12)
                  .map(
                    (p) => `
                      <div class="mini">
                        <a href="/project.html?pcode=${encodeURIComponent(p.pcode)}">
                          ${esc(p.pcode)}
                        </a>

                        <div class="d">
                          ${esc(p.projectName || "unnamed")}
                        </div>

                        <div class="d">
                          ${p.daysInStage === null
                            ? ""
                            : p.daysInStage + " days"}
                        </div>
                      </div>
                    `
                  )
                  .join("")}

                ${
                  rows.length > 12
                    ? `<div class="mini d">and ${rows.length - 12} more</div>`
                    : ""
                }
              </div>
            `;
          })
          .join("");
      }

      function showTab(which) {
        const work = which === "work";

        $("tab-work").classList.toggle("active", work);
        $("tab-board").classList.toggle("active", !work);

        $("view-work").classList.toggle("hidden", !work);
        $("view-board").classList.toggle("hidden", work);

        if (!work) renderBoard();
      }

      async function start() {
        await initAuth();

        if (!getAccount()) {
          $("who").textContent = "Not signed in";

          const gate = $("gate");
          gate.classList.remove("hidden");
          gate.innerHTML =
            "<p>Sign in with your Perfact account to see the pipeline.</p>";

          const button = document.createElement("button");
          button.className = "primary";
          button.textContent = "Sign in";
          button.onclick = () => signIn();

          gate.appendChild(button);
          return;
        }

        let me;

        try {
          me = await api.get("whoami");
        } catch (err) {
          $("who").textContent = "Access denied";

          const gate = $("gate");
          gate.classList.remove("hidden");
          gate.textContent =
            err.message ||
            "Your account has no role in this application.";

          return;
        }

        $("who").textContent = `${me.name}, ${me.role}`;
        $("view-work").classList.remove("hidden");

        $("tab-work").onclick = () => showTab("work");
        $("tab-board").onclick = () => showTab("board");

        $("project-search").addEventListener("input", (event) => {
          currentSearch = event.target.value;
          renderFilteredWork();
        });

        $("sort-projects").addEventListener("change", (event) => {
          currentSort = event.target.value;

          $("work-title").textContent =
            event.target.options[event.target.selectedIndex].textContent;

          renderFilteredWork();
        });

        try {
          await renderWork();
        } catch (err) {
          $("work-list").innerHTML = `
            <div class="empty">
              The work list could not be loaded.
              ${esc(err.message || "")}
            </div>
          `;
        }
      }

      start();
    </script>
  </body>
</html>
