<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfact Intranet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/assets/tokens.css" />
    <style>
      main {
        max-width: 680px;
        margin: 0 auto;
        padding: 64px 24px;
      }
      h1 {
        color: var(--pine);
        font-size: 2rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--ink-soft);
        margin: 0 0 24px;
      }
      .status {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        background: var(--moss-soft);
        color: var(--pine);
        padding: 12px 16px;
        border-radius: var(--radius-input);
        border: 1px solid var(--line);
      }

      #sliderContainer {
        width: 100%;
        max-width: 850px;
        height: 740px;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      #memberGrid {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        scroll-behavior: smooth;
      }
      #memberGrid::-webkit-scrollbar {
        width: 4px;
      }
      #memberGrid::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
      }
      .img-fluid {
        object-fit: cover;
        height: 100%;
        width: 100%;
        cursor: pointer;
        transition:
          filter 0.3s ease,
          transform 0.2s ease;
        background: #e5e7eb;
      }
      .img-fluid:hover {
        transform: scale(1.05);
      }
      .blur-load {
        filter: blur(10px);
      }
      .blur-load.loaded {
        filter: blur(0);
      }
      #loadingScreen {
        position: absolute;
        inset: 0;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .pos-badge {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #infoModal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.85);
        z-index: 100;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
      }
      .modal-content {
        background: white;
        padding: 2.5rem;
        border-radius: 2.5rem;
        max-width: 500px;
        width: 94%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        animation: modalScale 0.2s ease-out;
      }
      @keyframes modalScale {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 p-2 min-h-screen flex items-center justify-center">
    <main>
      <h1>Perfact Intranet</h1>
      <p>BD Pipeline application. Build in progress.</p>
      <div class="status">Phase B0, step S0.3. Front end serving.</div>

      <div class="max-w-5xl w-full mx-auto relative flex justify-center">
        <button
          onclick="manualMove(-1)"
          class="absolute -left-12 top-1/2 -translate-y-1/2 bg-white shadow-lg p-3 rounded-full hover:bg-blue-600 hover:text-white z-10 transition-all"
        >
          <i data-feather="chevron-left"></i>
        </button>
        <button
          onclick="manualMove(1)"
          class="absolute -right-12 top-1/2 -translate-y-1/2 bg-white shadow-lg p-3 rounded-full hover:bg-blue-600 hover:text-white z-10 transition-all"
        >
          <i data-feather="chevron-right"></i>
        </button>

        <div
          id="sliderContainer"
          class="bg-white p-6 rounded-[2.5rem] shadow-2xl border border-gray-100 overflow-hidden"
        >
          <div id="loadingScreen">
            <div
              class="w-8 h-8 border-4 border-gray-100 border-t-blue-600 rounded-full animate-spin mb-3"
            ></div>
            <p
              class="text-gray-400 font-bold text-[10px] uppercase tracking-widest"
            >
              Perfact Team Slider
            </p>
          </div>

          <h2
            id="teamTitle"
            class="text-2xl font-light text-center text-gray-800 mb-4 uppercase italic tracking-tighter shrink-0"
          ></h2>

          <div id="bdWrapper" class="flex flex-col items-center mb-3 shrink-0">
            <div id="bdSection" class="hidden flex-col items-center">
              <div
                class="w-28 h-28 rounded-2xl border-4 border-amber-400 shadow-md overflow-hidden"
              >
                <img
                  id="bdImg"
                  class="img-fluid blur-load"
                  onclick="openModal('bd')"
                />
              </div>
              <p id="bdName" class="mt-1 text-gray-800 font-black text-lg"></p>
              <span
                class="pos-badge text-amber-600 bg-amber-50 px-3 py-0.5 rounded-full border border-amber-100"
                >Business Head</span
              >
            </div>
          </div>

          <div
            id="middleSection"
            class="flex flex-row justify-center gap-8 mb-4 border-t border-b border-gray-50 py-4 min-h-[140px] shrink-0"
          ></div>

          <div
            id="memberGrid"
            class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-4 content-start pb-4"
          ></div>
        </div>
      </div>

      <div id="infoModal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
          <button
            onclick="closeModal()"
            class="absolute top-6 right-6 text-gray-400 hover:text-red-500"
          >
            <i data-feather="x"></i>
          </button>

          <div class="flex flex-col items-center text-center mb-6">
            <div
              class="w-40 h-40 rounded-3xl overflow-hidden shadow-2xl border-4 border-blue-500 mb-4 bg-gray-100"
            >
              <img id="m-img" class="w-full h-full object-cover" />
            </div>
            <h3
              id="m-name"
              class="text-2xl font-black text-gray-800 uppercase"
            ></h3>
            <p
              id="m-pos"
              class="text-blue-600 font-bold text-xs uppercase tracking-widest mt-2 bg-blue-50 px-3 py-1 rounded-full"
            ></p>
          </div>

          <div class="space-y-5">
            <div>
              <h4
                class="text-[10px] font-black text-gray-400 uppercase mb-2 border-b"
              >
                🎯 Core Responsibilities
              </h4>
              <div
                id="m-list-resps"
                class="space-y-1.5 text-sm text-gray-600"
              ></div>
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
              <h4 class="text-[10px] font-black text-blue-800 uppercase mb-2">
                🏢 Administrative Duties
              </h4>
              <div
                id="m-list-admin"
                class="space-y-1 text-xs text-gray-500"
              ></div>
            </div>

            <div
              id="sec-mng"
              class="bg-amber-50 p-4 rounded-2xl border border-amber-100 hidden"
            >
              <h4 class="text-[10px] font-black text-amber-800 uppercase mb-2">
                📈 Management Responsibilities
              </h4>
              <div
                id="m-list-mng"
                class="space-y-1 text-xs text-amber-700"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycby8yAAtebe6QS9LWNpvT_ZwpDZ68SFML_OZr7CjSZ0S3jW4YnpotiBDDLkPkR-2X8iv/exec";
      let teams = [],
        index = 0,
        autoSlideTimer;

      function fixLink(url, size = 300) {
        if (!url || !url.includes("drive.google.com"))
          return "https://via.placeholder.com/150";
        const idMatch = url.match(/[-\w]{25,}/);
        return idMatch
          ? `https://drive.google.com/thumbnail?sz=w${size}&id=${idMatch[0]}`
          : url;
      }

      async function loadData() {
        try {
          const res = await fetch(API_URL);
          teams = await res.json();
          if (teams.length > 0) {
            document.getElementById("loadingScreen").style.display = "none";
            render();
            startTimer();
          }
        } catch (e) {
          document.querySelector("#loadingScreen p").innerText = "Load Error";
        }
      }

      function render() {
        const t = teams[index];
        if (!t) return;
        document.getElementById("teamTitle").innerText = t.name;

        // Render BD Head
        const bdw = document.getElementById("bdWrapper");
        const bds = document.getElementById("bdSection");
        if (t.bdHead) {
          bdw.style.display = "flex";
          bds.style.display = "flex";
          document.getElementById("bdName").innerText = t.bdHead.name;
          progressiveLoad(document.getElementById("bdImg"), t.bdHead.img, 300);
        } else {
          bdw.style.display = "none";
        }

        // Render FE/Team Heads
        const mid = document.getElementById("middleSection");
        let midHtml = "";
        if (t.fe1) midHtml += createLeadCard(t.fe1, "FE1 Admin Head", "fe1");
        if (t.fe2) midHtml += createLeadCard(t.fe2, "FE2", "fe2");
        if (!t.fe1 && !t.fe2 && t.teamHead)
          midHtml = createLeadCard(t.teamHead, "Team Leader", "head");

        mid.innerHTML = midHtml;
        mid.style.display = midHtml ? "flex" : "none";

        // Render Staff
        document.getElementById("memberGrid").innerHTML = t.staff
          .map(
            (m, i) => `
      <div class="flex flex-col items-center text-center">
        <div class="w-24 h-24 rounded-2xl overflow-hidden border border-gray-100 mb-2 shadow-sm bg-gray-200">
           <img src="${fixLink(m.img, 50)}" 
                data-full="${fixLink(m.img, 200)}"
                class="img-fluid blur-load" 
                onload="this.classList.add('loaded'); this.src=this.dataset.full; this.onload=null;"
                onclick="openModal('staff', ${i})">
        </div>
        <p class="text-[12px] font-bold text-gray-800 leading-tight">${m.name}</p>
        <p class="pos-badge mt-0.5 text-blue-500">${m.position}</p>
      </div>
    `,
          )
          .join("");
        feather.replace();
      }

      function createLeadCard(m, label, type) {
        return `<div class="flex flex-col items-center">
      <div class="w-32 h-32 rounded-full border-4 border-blue-500 shadow-md overflow-hidden bg-gray-200">
        <img src="${fixLink(m.img, 50)}" 
             data-full="${fixLink(m.img, 300)}"
             class="img-fluid blur-load" 
             onload="this.classList.add('loaded'); this.src=this.dataset.full; this.onload=null;"
             onclick="openModal('${type}')">
      </div>
      <p class="mt-1 text-gray-800 font-black text-base">${m.name}</p>
      <span class="pos-badge text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100">${label}</span>
    </div>`;
      }

      function openModal(role, idx = null) {
        stopTimer();
        const t = teams[index];
        const mngRoles = ["bd", "head", "fe1", "fe2"]; // Roles allowed to see Management Responsibilities

        let p =
          role === "bd"
            ? t.bdHead
            : role === "head"
              ? t.teamHead
              : role === "fe1"
                ? t.fe1
                : role === "fe2"
                  ? t.fe2
                  : t.staff[idx];

        if (!p) return;

        document.getElementById("m-img").src = fixLink(p.img, 300);
        document.getElementById("m-name").innerText = p.name;
        document.getElementById("m-pos").innerText = p.position.toUpperCase();

        const taskHtml = (tasks) =>
          tasks && tasks.length
            ? tasks
                .map((t) => `<div class="flex gap-2"><span>•</span>${t}</div>`)
                .join("")
            : '<div class="text-gray-400">None assigned</div>';

        document.getElementById("m-list-resps").innerHTML = taskHtml(p.resps);
        document.getElementById("m-list-admin").innerHTML = taskHtml(
          p.adminResps,
        );

        // Conditional Management Logic
        const mngSection = document.getElementById("sec-mng");
        if (mngRoles.includes(role)) {
          mngSection.classList.remove("hidden");
          document.getElementById("m-list-mng").innerHTML = taskHtml(
            p.mngResps,
          );
        } else {
          mngSection.classList.add("hidden");
        }

        document.getElementById("infoModal").style.display = "flex";
      }

      function progressiveLoad(imgEl, driveUrl, targetSize) {
        imgEl.classList.remove("loaded");
        imgEl.src = fixLink(driveUrl, 50);
        const highRes = new Image();
        highRes.onload = () => {
          imgEl.src = highRes.src;
          imgEl.classList.add("loaded");
        };
        highRes.src = fixLink(driveUrl, targetSize);
      }

      function closeModal() {
        document.getElementById("infoModal").style.display = "none";
        startTimer();
      }
      function startTimer() {
        stopTimer();
        autoSlideTimer = setInterval(() => move(1), 6000);
      }
      function stopTimer() {
        clearInterval(autoSlideTimer);
      }
      function move(n) {
        if (teams.length < 2) return;
        index = (index + n + teams.length) % teams.length;
        render();
      }
      function manualMove(n) {
        move(n);
        startTimer();
      }

      window.onload = loadData;
    </script>
  </body>
</html>
