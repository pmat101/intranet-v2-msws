<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base target="_top" />
    <title>AQ Report - FR01</title>

    <?!= HtmlService.createHtmlOutputFromFile('sharedStyles').getContent(); ?>
    <?!= HtmlService.createHtmlOutputFromFile('sharedComponents').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">FR01</div>
      <div class="form-subtitle">AQ Report</div>

      <div id="prefill-area"></div>

      <div class="form-section">
        <div class="section-heading">Responder Details</div>
        <div id="f_responder"></div>
      </div>

      <div class="form-section">
        <div class="section-heading">Project Identity</div>
        <div id="f_fields"></div>
        <div id="f_selects"></div>
      </div>

      <div class="form-section">
        <div class="section-heading">Report Details</div>
        <div id="f_links"></div>
        <div id="f_status_logic"></div>
      </div>

      <div class="form-section">
        <div class="section-heading">Technical AQ Data</div>
        <div id="f_technical"></div>
      </div>

      <div class="form-section">
        <div id="f_final"></div>
        <div style="margin-top: 15px; padding: 10px; border: 1px solid #ddd; background: #f9f9f9;">
          <input type="checkbox" id="disclaimer_check" />
          <label for="disclaimer_check" style="margin-left: 8px;">
            <strong>Disclaimer *</strong>: I hereby confirm that all information in the report is correct and to the best of my knowledge and I own the responsibility for any error.
          </label>
        </div>
      </div>

      <div style="margin-top: 20px">
        <button class="btn-primary" id="submitBtn">Submit</button>
        <span id="status" class="text-muted" style="margin-left: 12px"></span>
      </div>
    </div>

    <script>
      const FORM_CODE = "FR01";

      const resContainer = document.getElementById("f_responder");
      const projContainer = document.getElementById("f_fields");
      const selContainer = document.getElementById("f_selects");
      const linkContainer = document.getElementById("f_links");
      const statusContainer = document.getElementById("f_status_logic");
      const techContainer = document.getElementById("f_technical");
      const finalContainer = document.getElementById("f_final");

      // --- Responder Details ---
      renderField(resContainer, { label: "Date", id: "report_date", type: "date" });
      renderField(resContainer, { label: "First Name", id: "first_name" });
      renderField(resContainer, { label: "Last Name", id: "last_name" });
      renderField(resContainer, { label: "Official Email ID of Responder *", id: "email_id", placeholder: "Required" });
      const teamSelect = renderField(resContainer, { label: "Recipient Team Name *", id: "team_name", type: "select" });

      // --- Project Identity ---
      renderField(projContainer, { label: "Company Name", id: "company_name" });
      renderField(projContainer, { label: "Name of the project *", id: "project_name" });
      const pcodeInput = renderField(projContainer, { 
        label: "PCODE *", id: "pcode", 
        helper: "REFER LINK: https://docs.google.com/spreadsheets/d/1POfI4IgCQv7Pj2dcaOj3mZG_Tnuybid-eVrLQn5KO9k/edit?usp=sharing" 
      });

      const catSelect = renderField(selContainer, { label: "Category *", id: "category", type: "select" });
      const sectorSelect = renderField(selContainer, { label: "Sector *", id: "sector", type: "select" });
      const eacSelect = renderField(selContainer, { label: "EAC Name", id: "eac_name", type: "select" });

      // --- Report Links & Status ---
      renderField(linkContainer, { label: "Editable Report Link *", id: "editable_link" });
      renderField(linkContainer, { label: "PDF Link *", id: "pdf_link" });
      
      const updateStatus = renderField(statusContainer, { label: "Report update status *", id: "update_status", type: "select" });
      renderField(statusContainer, { label: "Revision Number *", id: "revision_no" });
      renderField(statusContainer, { label: "Earlier report given to client * (Link)", id: "earlier_report_link" });

      // --- Technical Data ---
      renderField(techContainer, { label: "Background Concentration *", id: "bg_concentration" });
      renderField(techContainer, { label: "Air background *", id: "air_background" });
      renderField(techContainer, { label: "mGLC", id: "mglc" });
      renderField(techContainer, { label: "Key output from modelling *", id: "modelling_output" });
      renderField(techContainer, { label: "Impact on key receptors", id: "receptors_impact" });
      renderField(techContainer, { label: "Impact Envisaged *", id: "impact_envisaged" });
      renderField(techContainer, { label: "Mitigation Strategy *", id: "mitigation_strategy" });

      // --- Final Recommendation ---
      const recSelect = renderField(finalContainer, { 
        label: "Do you recommend this project should be granted environmental clearance? *", 
        id: "recommendation", type: "select" 
      });
      renderField(finalContainer, { label: "Remarks", id: "remarks", placeholder: "if any" });

      // --- Populate Options ---
      const teams = ["Arctic","Canal","Cove","Creek","Delta","Estuary","Fountain","Glacier","Lagoon","Lakes","Oasis","Ocean","Pond","Pool","Reservoir","River","Spring","Tributary","Upstream","N/A"];
      teams.forEach(t => teamSelect.appendChild(new Option(t, t)));

      ["A", "B1", "B2"].forEach(c => catSelect.appendChild(new Option(c, c)));
      
      const sectors = ["1a","1b","1d","2a","2b","3a","3b","4a","4c","4d","4f","5a","5b","5c","5d","5e","5f","5g","5h","5j","6a","6b","7a","7b","7c","7d","7da","7e","7f","7g","7h","7i","8a","8b"];
      sectors.forEach(s => sectorSelect.appendChild(new Option(s, s)));

      const eacs = ["Coal Mining","Non-Coal Mining","CRZ","Hydro & River Valley","Industry-1","Industry-2","Industry-3","Infrastructure-1","Infrastructure-2","Nuclear & Defence","Thermal","Violation Cases","Andaman and Nicobar SEAC/SEIAA","Andhra Pradesh SEAC/SEIAA","Arunachal Pradesh SEAC/SEIAA","Assam SEAC/SEIAA","Bihar SEAC/SEIAA","Chandigarh SEAC/SEIAA","Chattisgarh SEAC/SEIAA","Daman, Diu, Dadra and Nagar Haveli SEAC/SEIAA","Delhi SEAC/SEIAA","Goa SEAC/SEIAA","Gujarat SEAC/SEIAA","Haryana SEAC/SEIAA","Himachal Pradesh SEAC/SEIAA","Jammu & Kashmir SEAC/SEIAA","Jharkhand SEAC/SEIAA","Karnataka SEAC/SEIAA","Kerala SEAC/SEIAA","Ladakh SEAC/SEIAA","Lakshadweep SEAC/SEIAA","Madhya Pradesh SEAC/SEIAA","Maharashtra SEAC/SEIAA","Manipur SEAC/SEIAA","Meghalaya SEAC/SEIAA","Mizoram SEAC/SEIAA","Nagaland SEAC/SEIAA","Odisha SEAC/SEIAA","Puducherry SEAC/SEIAA","Punjab SEAC/SEIAA","Rajasthan SEAC/SEIAA","Sikkim SEAC/SEIAA","Tamil Nadu SEAC/SEIAA","Telangana SEAC/SEIAA","Tripura SEAC/SEIAA","Uttar Pradesh SEAC/SEIAA","Uttarakhand SEAC/SEIAA","West Bengal SEAC/SEIAA"];
      eacs.forEach(e => eacSelect.appendChild(new Option(e, e)));

      ["New", "Revised"].forEach(st => updateStatus.appendChild(new Option(st, st)));
      ["Yes", "No"].forEach(r => recSelect.appendChild(new Option(r, r)));

      // --- Logic: Prefill ---
      pcodeInput.addEventListener("blur", function () {
        const v = this.value && this.value.trim();
        if (v) autoPrefillFromProject(v);
      });

      function autoPrefillFromProject(pcode) {
        google.script.run
          .withSuccessHandler(function (project) {
            if (!project) return;
            Object.keys(project).forEach(key => {
              const field = document.getElementById(key);
              if (field) field.value = project[key];
            });
          })
          .getProjectByPcode(pcode);
      }

      // --- Logic: Submit ---
      document.getElementById("submitBtn").addEventListener("click", function () {
        if(!document.getElementById("disclaimer_check").checked) {
            alert("Please accept the disclaimer to proceed.");
            return;
        }

        const payload = {
          report_date: document.getElementById("report_date").value,
          first_name: document.getElementById("first_name").value,
          last_name: document.getElementById("last_name").value,
          email_id: document.getElementById("email_id").value,
          team_name: document.getElementById("team_name").value,
          company_name: document.getElementById("company_name").value,
          project_name: document.getElementById("project_name").value,
          pcode: document.getElementById("pcode").value,
          category: document.getElementById("category").value,
          sector: document.getElementById("sector").value,
          eac_name: document.getElementById("eac_name").value,
          editable_link: document.getElementById("editable_link").value,
          pdf_link: document.getElementById("pdf_link").value,
          update_status: document.getElementById("update_status").value,
          revision_no: document.getElementById("revision_no").value,
          earlier_report_link: document.getElementById("earlier_report_link").value,
          bg_concentration: document.getElementById("bg_concentration").value,
          air_background: document.getElementById("air_background").value,
          mglc: document.getElementById("mglc").value,
          modelling_output: document.getElementById("modelling_output").value,
          receptors_impact: document.getElementById("receptors_impact").value,
          impact_envisaged: document.getElementById("impact_envisaged").value,
          mitigation_strategy: document.getElementById("mitigation_strategy").value,
          recommendation: document.getElementById("recommendation").value,
          remarks: document.getElementById("remarks").value
        };

        google.script.run
          .withSuccessHandler(res => {
            document.getElementById("status").innerText = "Submitted: " + (res.submission_id || "Success");
          })
          .withFailureHandler(err => {
            document.getElementById("status").innerText = "Error: " + err.message;
          })
          .submitForm(FORM_CODE, payload);
      });
    </script>
  </body>
</html>
