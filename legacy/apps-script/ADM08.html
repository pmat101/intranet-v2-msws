<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base target="_top" />
    <title>ADM08 - Vendor Review Form</title>
    <?!= HtmlService.createHtmlOutputFromFile('sharedStyles').getContent(); ?>
    <?!= HtmlService.createHtmlOutputFromFile('sharedComponents').getContent(); ?>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-title">ADM08 - Vendor Review Form</div>
      <div class="form-subtitle">Submit vendor review details</div>

      <div id="f_fields"></div>

      <div style="margin-top: 20px">
        <button class="btn-primary" id="submitBtn">Submit</button>
        <span id="status" class="text-muted" style="margin-left: 12px"></span>
      </div>
    </div>

    <script>
      const FORM_CODE = "adm08";
      const c = document.getElementById("f_fields");

      // Requestor Info
      renderField(c, { label: "First Name", id: "first_name" });
      renderField(c, { label: "Last Name", id: "last_name" });
      renderField(c, { label: "Email *", id: "email", type: "email" });
      renderField(c, { label: "E Code of the Requestor *", id: "ecode" });
      renderField(c, { label: "Date", id: "date", type: "date", placeholder: "dd-MMM-yyyy" });
      renderField(c, { label: "Department *", id: "department" });

      // Vendor Info
      renderField(c, { label: "Vendor First Name", id: "vendor_first_name" });
      renderField(c, { label: "Vendor Last Name", id: "vendor_last_name" });
      renderField(c, { label: "Vendor Company Name", id: "vendor_company" });
      renderField(c, { label: "Type of Vendor *", id: "vendor_type" });

      renderField(c, { label: "Date of Last Work/Services/Purchase", id: "last_work_date", type: "date", placeholder: "dd-MMM-yyyy" });
      renderField(c, { label: "Details of Last Work Done *", id: "last_work_details", type: "textarea" });
      renderField(c, { label: "Rating", id: "rating" });

      // Timeliness dropdown
      renderField(c, {
        label: "Timeliness of Work Done *",
        id: "timeliness",
        type: "select",
        options: ["Within 1 day", "Within 2 days", "Within 3 days", "Other"]
      });

      renderField(c, { label: "Remarks, if any", id: "remarks", type: "textarea" });

      // Submit handler
      document.getElementById("submitBtn").addEventListener("click", function () {
        const payload = {
          first_name: document.getElementById("first_name")?.value || "",
          last_name: document.getElementById("last_name")?.value || "",
          email: document.getElementById("email")?.value || "",
          ecode: document.getElementById("ecode")?.value || "",
          date: document.getElementById("date")?.value || "",
          department: document.getElementById("department")?.value || "",
          vendor_first_name: document.getElementById("vendor_first_name")?.value || "",
          vendor_last_name: document.getElementById("vendor_last_name")?.value || "",
          vendor_company: document.getElementById("vendor_company")?.value || "",
          vendor_type: document.getElementById("vendor_type")?.value || "",
          last_work_date: document.getElementById("last_work_date")?.value || "",
          last_work_details: document.getElementById("last_work_details")?.value || "",
          rating: document.getElementById("rating")?.value || "",
          timeliness: document.getElementById("timeliness")?.value || "",
          remarks: document.getElementById("remarks")?.value || ""
        };

        google.script.run
          .withSuccessHandler(res => {
            document.getElementById("status").innerText = "Submitted: " + (res.submission_id || "OK");
          })
          .withFailureHandler(err => {
            document.getElementById("status").innerText = "Submit failed: " + err.message;
          })
          .submitForm(FORM_CODE.toUpperCase(), payload);
      });
    </script>
  </body>
</html>
