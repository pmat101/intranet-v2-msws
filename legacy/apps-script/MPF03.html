<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<base target="_top"/>
<title>MPF03</title>

<?!= HtmlService.createHtmlOutputFromFile('sharedStyles').getContent(); ?>
<?!= HtmlService.createHtmlOutputFromFile('sharedComponents').getContent(); ?>
</head>

<body>
<div class="form-wrapper">

<div class="form-title">MPF03</div>
<div class="form-subtitle">Monthly Performance Form (For FAAs and FAEs)</div>

<div id="f_fields"></div>

<!-- REPORT STATUS MULTIPLE -->
<div class="form-section">
  <div class="section-heading">Report Status</div>
  <div id="reportStatusBody"></div>
  <button type="button" class="btn-secondary" id="addReportStatusBtn">
    + Add Report Status
  </button>
</div>

<div style="margin-top:20px">
  <button class="btn-primary" id="submitBtn">Submit</button>
  <span id="status" style="margin-left:12px"></span>
</div>

</div>

<script>

const FORM_CODE = "mpf03";
const c = document.getElementById("f_fields");

/* ================= BASIC DETAILS ================= */

renderField(c,{label:"Month *Required",id:"month",type:"month"});

renderField(c,{label:"First Name",id:"first_name"});
renderField(c,{label:"Last Name",id:"last_name"});
renderField(c,{label:"Email ID *Required",id:"email"});
renderField(c,{label:"Area of Expertise",id:"expertise"});

renderField(c,{label:"No. of requests received *Required",id:"requests_received",type:"number"});
renderField(c,{label:"No. of reports released *Required",id:"reports_released",type:"number"});
renderField(c,{label:"Site Visits / Coordination Meetings done *Required",id:"site_visits",type:"number"});
renderField(c,{label:"New reports submitted *Required",id:"new_reports",type:"number"});
renderField(c,{label:"Old reports corrected *Required",id:"old_reports_corrected",type:"number"});

renderField(c,{
  label:"Complaints / Negative Feedback received in old reports from Client or Committee",
  id:"complaints_feedback",
  type:"textarea"
});

/* ================= REPORT STATUS MULTIPLE ================= */

document.getElementById("addReportStatusBtn").onclick = function(){

  const d = document.createElement("div");
  d.className = "subform-row";

  d.innerHTML = `
    <input class="rs_project" placeholder="Project Name">
    <input class="rs_pcode" placeholder="PCODE *Required">
    <input type="date" class="rs_date" placeholder="Date of request *Required">
    <input class="rs_status" placeholder="Status *Required">
    <button type="button" onclick="this.parentElement.remove()">Remove</button>
  `;

  reportStatusBody.appendChild(d);
};

function collectReportStatus(){
  return Array.from(
    document.querySelectorAll("#reportStatusBody .subform-row")
  ).map(r=>({
      project:r.querySelector(".rs_project")?.value||"",
      pcode:r.querySelector(".rs_pcode")?.value||"",
      date:r.querySelector(".rs_date")?.value||"",
      status:r.querySelector(".rs_status")?.value||""
  })).filter(x=>x.pcode); // Only save if PCODE entered
}

/* ================= PERFORMANCE SECTION ================= */

renderField(c,{label:"Targets planned this month",id:"targets_planned",type:"textarea"});
renderField(c,{label:"Targets achieved this month",id:"targets_achieved",type:"textarea"});
renderField(c,{label:"Highlights",id:"highlights",type:"textarea"});
renderField(c,{label:"Low Points",id:"low_points",type:"textarea"});
renderField(c,{label:"Challenges faced",id:"challenges",type:"textarea"});
renderField(c,{label:"Projected targets for next month",id:"projected_targets",type:"textarea"});

/* ================= SUBMIT ================= */

document.getElementById("submitBtn").onclick = function(){

  const payload = {};

  document.querySelectorAll("#f_fields input, #f_fields textarea")
  .forEach(el=>{
      payload[el.id] = el.value || "";
  });

  payload.report_status = collectReportStatus();

  google.script.run
    .withSuccessHandler(res=>{
      document.getElementById("status").innerText =
        "Submitted Successfully: " + (res.submission_id || "OK");
    })
    .withFailureHandler(err=>{
      document.getElementById("status").innerText =
        "Submission Failed: " + err.message;
    })
    .submitForm(FORM_CODE.toUpperCase(), payload);
};

</script>
</body>
</html>
