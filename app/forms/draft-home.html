<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Perfact Intranet</title>

  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="icon" href="/assets/perfact-logo.png">

  <style>
    :root{
      --max:1080px;
      --gutter:clamp(20px,5vw,44px);
    }

    *{box-sizing:border-box}
    body{margin:0;overflow-x:hidden}
    a{text-decoration:none;color:inherit}

    .wrap{
      max-width:var(--max);
      margin:auto;
      padding-inline:var(--gutter);
    }

    .skip{
      position:absolute;
      top:-40px;
      left:12px;
      z-index:100;
      padding:8px 14px;
      background:var(--card);
      border-radius:8px;
    }

    .skip:focus{top:12px}

    /* HERO */

    .hero{
      position:relative;
      min-height:calc(100vh - 48px);
      display:flex;
      align-items:center;
      overflow:hidden;
      isolation:isolate;
      padding:70px 0 80px;
      background:var(--bg);
    }

    .terrain{
      position:absolute;
      inset:0;
      z-index:-1;
      overflow:hidden;
      pointer-events:none;
    }

    .terrain svg{
      width:100%;
      height:100%;
      display:block;
      overflow:hidden;
    }

    .contour{
      fill:none;
      stroke:var(--pine);
      stroke-width:1;
      opacity:.16;
    }

    .contour.bold{
      stroke-width:1.5;
      opacity:.28;
    }

    .grid{
      stroke:var(--pine);
      stroke-width:1;
      opacity:.12;
    }

    .river{
      fill:none;
      stroke:var(--river);
      stroke-linecap:round;
    }

    .river.soft{
      stroke-width:9;
      opacity:.12;
    }

    .river.main{
      stroke-width:2.4;
      opacity:.72;
    }

    .station{
      fill:var(--bg);
      stroke:var(--river);
      stroke-width:1.5;
    }

    .station-dot{
      fill:var(--river);
    }

    .hero-content{
      width:100%;
    }

    .hero h1{
      margin:0;
      max-width:13ch;
      font-size:clamp(46px,8vw,104px);
      line-height:.96;
      letter-spacing:-.045em;
    }

    .lede{
      margin:24px 0 0;
      max-width:34ch;
      font-size:clamp(18px,2vw,23px);
      line-height:1.35;
      color:var(--ink-soft);
    }

    /* SEARCH */

    .find{
      position:relative;
      max-width:560px;
      margin-top:40px;
    }

    .field{
      height:54px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 16px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 8px 30px
        color-mix(in srgb,var(--pine) 15%,transparent);
    }

    .field svg{
      width:18px;
      color:var(--ink-soft);
      flex:none;
    }

    .field input{
      flex:1;
      min-width:0;
      border:0;
      outline:0;
      background:none;
      color:var(--ink);
      font-size:17px;
    }

    .field kbd{
      font-size:12px;
      color:var(--ink-soft);
      border:1px solid var(--line);
      border-radius:6px;
      padding:2px 7px;
    }

    .results{
      position:absolute;
      left:0;
      right:0;
      top:62px;
      z-index:20;
      margin:0;
      padding:6px;
      list-style:none;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      max-height:350px;
      overflow:auto;
    }

    .results[hidden]{display:none}

    .results a{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border-radius:8px;
    }

    .results a:hover,
    .results li[aria-selected=true] a{
      background:var(--moss-soft);
    }

    .results small{color:var(--ink-soft)}

    /* CONTENT */

    main section{
      padding:64px 0;
    }

    main section+section{
      border-top:1px solid var(--line);
    }

    .shead{
      margin-bottom:26px;
    }

    .shead h2{
      margin:0;
      font-size:clamp(26px,3vw,34px);
      letter-spacing:-.03em;
    }

    .tiles{
      display:grid;
      grid-template-columns:1.35fr 1fr 1fr;
      gap:14px;
    }

    .tile{
      min-height:200px;
      padding:22px 24px;
      display:flex;
      flex-direction:column;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      transition:.16s;
    }

    .tile:hover{
      transform:translateY(-2px);
    }

    .tile svg{
      width:26px;
      color:var(--pine);
    }

    .tile h3{
      margin:auto 0 0;
      padding-top:25px;
      font-size:22px;
    }

    .tile p{
      margin:6px 0 0;
      font-size:14.5px;
      color:var(--ink-soft);
    }

    .tile.lead{
      background:var(--pine-b);
      border-color:var(--pine-b);
    }

    .tile.lead h3,
    .tile.lead svg{
      color:var(--hero-ink);
    }

    .tile.lead p{
      color:var(--hero-sub);
    }

    .groups{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:30px;
    }

    .group h3{
      margin:0 0 12px;
      font-size:13px;
    }

    .group ul{
      margin:0;
      padding:0;
      list-style:none;
    }

    .group li+li{margin-top:3px}

    .group a{
      color:var(--ink-soft);
      font-size:15px;
    }

    .group a:hover{color:var(--pine)}

    /* TEAMS */

    .leads{
      display:flex;
      gap:40px;
      flex-wrap:wrap;
      margin-bottom:32px;
    }

    .person{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .mono{
      width:48px;
      height:48px;
      display:grid;
      place-items:center;
      flex:none;
      border-radius:50%;
      background:var(--moss-soft);
      color:var(--pine);
      font-weight:600;
    }

    .person b{display:block}
    .person i{
      display:block;
      color:var(--ink-soft);
      font-size:13px;
      font-style:normal;
    }

    .members{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
      gap:18px;
    }

    /* FOOTER */

    footer{
      border-top:1px solid var(--line);
      padding:30px 0 40px;
      color:var(--ink-soft);
      font-size:13px;
    }

    footer .wrap{
      display:flex;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    footer nav{
      display:flex;
      gap:22px;
    }

    /* SIGN IN */

    .gate{margin-top:35px}

    .gate button{
      border:0;
      border-radius:999px;
      padding:13px 25px;
      background:var(--amber);
      color:#fff;
      font-weight:600;
      cursor:pointer;
    }

    .gate p{
      color:var(--ink-soft);
      font-size:14px;
    }

    .hidden{display:none!important}

    @media(max-width:980px){
      .groups{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:720px){
      .hero{
        min-height:calc(100vh - 48px);
        padding:50px 0 60px;
      }

      .tiles{grid-template-columns:1fr}
      .field kbd{display:none}
    }

    @media(max-width:460px){
      .groups{grid-template-columns:1fr}
    }
  </style>
</head>

<!-- TOPBAR LOADER -->
<script>
async function loadTopbar(){

  const box=document.getElementById("topbar");
  const res=await fetch("/forms/topbar.html");
  const doc=new DOMParser()
    .parseFromString(await res.text(),"text/html");

  doc.querySelectorAll("style").forEach(s=>{
    document.head.appendChild(s.cloneNode(true));
  });

  doc.body.childNodes.forEach(n=>{
    if(n.nodeName!=="SCRIPT")
      box.appendChild(document.importNode(n,true));
  });

  doc.querySelectorAll("script").forEach(old=>{

    const s=document.createElement("script");

    [...old.attributes].forEach(a=>{
      s.setAttribute(a.name,a.value);
    });

    s.textContent=old.textContent;
    document.body.appendChild(s);

  });
}

loadTopbar();
</script>


<script src="/lib/vendor/msal-browser.min.js"></script>


<script type="module">

import {
  initAuth,
  signIn,
  getAccount
} from "/lib/auth.js";


/* DATA */

const NAV=[
  ["Technical guidelines","/forms/technical-guidelines.html"],
  ["EIA resource","#"],
  ["Accreditation hub","/forms/accreditation-hub.html"],
  ["Weekly roster","#"],
  ["Forms","/forms/"],
  ["Office resources","#"],
  ["MIS","#"],
  ["SPCB contacts","#"],
  ["Archive","#"]
];

const PRIMARY=[
  ["Forms","/forms/",
   "Every active form across performance, workflow, admin, BD, HR and more."],
  ["BD pipeline","/bd/",
   "Leads, proposals and handovers, and what is waiting on you."],
  ["Projects master dashboard","#",
   "Every live project and where it stands."]
];

const GROUPS={
  Quality:[
    ["QMSP, October 2025","#"],
    ["Annexures to QMSP","#"],
    ["Quality policy","#"],
    ["Quality control procedure","#"],
    ["Certificates","#"]
  ],

  People:[
    ["HR policies","#"],
    ["greytHR portal","#"],
    ["Etiquette","#"],
    ["Councils","#"]
  ],

  Office:[
    ["Office workflows","#"],
    ["Room booking","#"],
    ["Library","#"]
  ],

  Projects:[
    ["Active P-Codes","#"],
    ["All updates","#"],
    ["SOPs","#"]
  ]
};

const TEAM={
  name:"Fountain",
  head:["Rachna Dogra","Business head"],
  leader:["Amit Yadav","Team leader"],
  members:[
    "Dharmander Yadav",
    "Sonu Singh",
    "Tarun Yadav",
    "Meenakshi Yadav",
    "Shalini Pal"
  ]
};


/* HELPERS */

const $=id=>document.getElementById(id);

const esc=s=>String(s)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");

function initials(name){

  const words=name.split(/\s+/);

  return (
    words[0][0]+
    (words.length>1?
      words[words.length-1][0]:"")
  ).toUpperCase();
}


/* CONTENT */

function render(){

  $("tiles").innerHTML=PRIMARY.map((x,i)=>`
    <a class="tile ${i===0?"lead":""}" href="${x[1]}">

      <svg viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6">

        ${
          i===0
          ?`<path d="M7 3.5h7.5L19 8v12.5H7z"/>
             <path d="M14 3.5V8h5"/>
             <path d="M10 12.5h6M10 16h4"/>`
          :i===1
          ?`<path d="M4 7h11M4 12h8M4 17h5"/>
             <circle cx="18.5" cy="7" r="1.6"/>
             <circle cx="15.5" cy="12" r="1.6"/>
             <circle cx="12.5" cy="17" r="1.6"/>`
          :`<rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/>
             <rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/>
             <rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/>
             <rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/>`
        }

      </svg>

      <h3>${esc(x[0])}</h3>
      <p>${esc(x[2])}</p>

    </a>
  `).join("");


  $("groups").innerHTML=Object.entries(GROUPS).map(
    ([title,links])=>`
      <div class="group">

        <h3>${title}</h3>

        <ul>
          ${links.map(x=>`
            <li>
              <a href="${x[1]}">${esc(x[0])}</a>
            </li>
          `).join("")}
        </ul>

      </div>
    `
  ).join("");


  $("team").innerHTML=`

    <div class="leads">

      ${person(TEAM.head,true)}
      ${person(TEAM.leader,true)}

    </div>

    <div class="members">

      ${TEAM.members
        .map(x=>person([x,""]))
        .join("")}

    </div>

  `;


  $("foot").innerHTML=`
    <a href="/forms/">Forms</a>
    <a href="#">SOPs</a>
    <a href="#">All updates</a>
  `;
}


function person(data,big=false){

  return `
    <div class="person">

      <span
        class="mono"
        ${big?"style=\"width:56px;height:56px;font-size:18px\"":""}>
        ${initials(data[0])}
      </span>

      <span>
        <b>${esc(data[0])}</b>
        ${data[1]?`<i>${esc(data[1])}</i>`:""}
      </span>

    </div>
  `;
}


/* SEARCH */

function setupSearch(){

  const q=$("q");
  const list=$("results");

  const all=[
    ...PRIMARY.map(x=>({
      label:x[0],
      href:x[1],
      where:"Start here"
    })),

    ...Object.entries(GROUPS).flatMap(
      ([group,links])=>
        links.map(x=>({
          label:x[0],
          href:x[1],
          where:group
        }))
    ),

    ...NAV.map(x=>({
      label:x[0],
      href:x[1],
      where:"Menu"
    }))
  ];


  q.oninput=()=>{

    const term=q.value.trim().toLowerCase();

    if(!term){
      list.hidden=true;
      return;
    }


    const matches=all
      .filter(x=>x.label.toLowerCase().includes(term))
      .slice(0,7);


    const formUrl=
      `/forms/?q=${encodeURIComponent(term)}`;


    list.innerHTML=
      matches.map(x=>`
        <li>
          <a href="${x.href}">
            ${esc(x.label)}
            <small>${esc(x.where)}</small>
          </a>
        </li>
      `).join("")+

      `<li>
        <a href="${formUrl}">
          Search all forms for "${esc(term)}"
        </a>
      </li>`;


    list.hidden=false;
  };


  document.addEventListener("keydown",e=>{

    if(
      e.key==="/" &&
      document.activeElement!==q &&
      !/input|textarea/i.test(
        document.activeElement.tagName
      )
    ){

      e.preventDefault();
      q.focus();

    }

  });

}


/* START */

async function start(){

  await initAuth();

  const account=getAccount();

  if(!account){

    $("gate").classList.remove("hidden");
    $("signin").onclick=signIn;

    return;
  }


  const name=
    account.name||
    account.username||
    "User";

  const first=name.split(/\s+/)[0];

  const hour=new Date().getHours();

  const greet=
    hour<12
      ?"Good morning"
      :hour<17
        ?"Good afternoon"
        :"Good evening";


  $("greeting").textContent=
    `${greet}, ${first}.`;


  $("find").classList.remove("hidden");
  $("main").classList.remove("hidden");

  render();
  setupSearch();

}

start();

</script>
