<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project, Perfact Intranet</title>
    <link rel="stylesheet" href="/assets/tokens.css" />

    <style>
      body {
        padding-bottom: 64px;
      }

      header.bar {
        background: linear-gradient(135deg, var(--pine-a), var(--pine-b));
        color: var(--hero-ink);
        padding: 20px 0 24px;
      }

      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 0 24px;
      }

      header.bar h1 {
        margin: 10px 0 2px;
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-mono);
      }

      header.bar .name {
        font-size: 0.95rem;
        color: var(--hero-ink);
      }

      header.bar .sub {
        font-size: 0.78rem;
        color: var(--hero-sub);
        margin-top: 6px;
      }

      .ribbon {
        display: flex;
        gap: 3px;
        margin-top: 18px;
      }

      .stop {
        flex: 1;
        padding: 7px 8px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 0.66rem;
        color: var(--hero-sub);
        text-align: center;
        line-height: 1.25;
      }

      .stop.past {
        background: rgba(255, 255, 255, 0.2);
        color: var(--hero-ink);
      }

      .stop.now {
        background: var(--amber);
        color: #fff;
        font-weight: 600;
      }

      .cols {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }

      @media (max-width: 820px) {
        .cols {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        padding: 18px 22px;
        margin-bottom: 16px;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 0.8rem;
        color: var(--pine);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .step {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }

      .step:last-child {
        border-bottom: none;
      }

      .tick {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        margin-top: 1px;
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        color: transparent;
      }

      .step.done .tick {
        background: var(--moss);
        border-color: var(--moss);
        color: #fff;
      }

      .step.skip .tick {
        border-style: dashed;
      }

      .step-label {
        font-size: 0.88rem;
        color: var(--ink);
        font-weight: 600;
      }

      .step.pending .step-label {
        color: var(--ink-soft);
        font-weight: 400;
      }

      .step-detail {
        font-size: 0.76rem;
        color: var(--ink-soft);
        margin-top: 3px;
      }

      .step-when {
        font-size: 0.72rem;
        color: var(--ink-soft);
        white-space: nowrap;
        font-family: var(--font-mono);
      }

      .money {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 7px 14px;
        font-size: 0.84rem;
      }

      .money dt {
        color: var(--ink-soft);
      }

      .money dd {
        margin: 0;
        font-family: var(--font-mono);
        text-align: right;
        color: var(--ink);
      }

      .money dd.big {
        font-size: 1rem;
        color: var(--pine);
      }

      .finding {
        border-left: 3px solid var(--line);
        padding: 8px 0 8px 12px;
        margin-bottom: 10px;
        font-size: 0.8rem;
      }

      .finding.high {
        border-color: var(--danger);
      }

      .finding.medium {
        border-color: var(--amber);
      }

      .finding.low {
        border-color: var(--river);
      }

      .finding .sev {
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
      }

      .clean {
        font-size: 0.84rem;
        color: var(--moss);
      }

      .idblock {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
        font-size: 0.8rem;
      }

      .idblock dt {
        color: var(--ink-soft);
      }

      .idblock dd {
        margin: 0;
        font-family: var(--font-mono);
        color: var(--ink);
      }

      .next {
        background: var(--amber-soft);
        border: 1px solid var(--amber);
        border-radius: var(--radius-card);
        padding: 18px 22px;
        margin-bottom: 16px;
      }

      .next h2 {
        margin: 0 0 8px;
        font-size: 0.8rem;
        color: var(--amber-deep);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .next p {
        margin: 0 0 12px;
        font-size: 0.85rem;
        color: var(--ink);
      }

      .next a {
        display: inline-block;
        font-size: 0.85rem;
        font-weight: 600;
        background: var(--amber);
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: var(--radius-input);
      }

      .next a:hover {
        background: var(--amber-deep);
      }

      table.led {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
      }

      table.led th {
        text-align: left;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--ink-soft);
        padding-bottom: 6px;
      }

      table.led td {
        padding: 5px 0;
        border-top: 1px solid var(--line);
        font-family: var(--font-mono);
      }

      table.led td.src {
        font-family: var(--font-body);
        color: var(--ink-soft);
      }

      table.led td.amt {
        text-align: right;
      }

      .empty {
        color: var(--ink-soft);
        font-size: 0.85rem;
      }

      .loading {
        padding: 48px 0;
        color: var(--ink-soft);
        font-size: 0.9rem;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <header class="bar">
      <div class="wrap">
        <h1 id="h-pcode">&nbsp;</h1>
        <div class="name" id="h-name"></div>
        <div class="sub" id="h-sub"></div>
        <div class="ribbon" id="ribbon"></div>
      </div>
    </header>

    <main class="wrap">
      <div class="loading" id="loading">Loading the project...</div>

      <div id="content" class="hidden">
        <div id="next-wrap"></div>

        <div class="cols">
          <div>
            <div class="panel">
              <h2>The chain</h2>
              <div id="steps"></div>
            </div>

            <div class="panel">
              <h2>Ledger entries</h2>
              <div id="ledger"></div>
            </div>
          </div>

          <div>
            <div class="panel">
              <h2>Money</h2>
              <dl class="money" id="money"></dl>
            </div>

            <div class="panel">
              <h2>Reconciliation</h2>
              <div id="findings"></div>
            </div>

            <div class="panel">
              <h2>Identity</h2>
              <dl class="idblock" id="ids"></dl>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/lib/vendor/msal-browser.min.js"></script>

    <script type="module">
      import { initAuth, signIn, getAccount } from "/lib/auth.js";
      import { api } from "/lib/api.js";
      import { formatRupees } from "/lib/money.js";

      const $ = (id) => document.getElementById(id);

      const esc = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      const pcode = new URLSearchParams(location.search).get("pcode") || "";

      function shortDate(iso) {
        if (!iso) return "";

        const date = new Date(iso);

        if (Number.isNaN(date.getTime())) return "";

        return date.toLocaleDateString("en-IN", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      function renderRibbon(stages, currentIndex) {
        $("ribbon").innerHTML = stages
          .map((stage, index) => {
            const className =
              index < currentIndex
                ? "past"
                : index === currentIndex
                  ? "now"
                  : "";

            return `
              <div class="stop ${className}">
                ${esc(stage)}
              </div>
            `;
          })
          .join("");
      }

      function renderSteps(list) {
        $("steps").innerHTML = list
          .map((step) => {
            const className = step.done ? "done" : "pending";

            return `
              <div class="step ${className}">
                <span class="tick">&#10003;</span>

                <div>
                  <div class="step-label">
                    ${esc(step.label)}
                  </div>

                  ${
                    step.detail
                      ? `<div class="step-detail">${esc(step.detail)}</div>`
                      : ""
                  }
                </div>

                <span class="step-when">
                  ${shortDate(step.at)}
                </span>
              </div>
            `;
          })
          .join("");
      }

      function renderMoney(ledger) {
        if (!ledger) {
          $("money").innerHTML =
            `<dt class="empty">No ledger yet</dt><dd></dd>`;
          return;
        }

        const row = (label, amount, big = false) =>
          `<dt>${label}</dt><dd${big ? ' class="big"' : ""}>${formatRupees(amount)}</dd>`;

        $("money").innerHTML =
          row("Work order", ledger.committed, true) +
          row("Scheduled in milestones", ledger.scheduled) +
          row("Billable per delivery", ledger.billable) +
          row("Invoiced", ledger.invoiced) +
          row("Received", ledger.received) +
          row("Outstanding", ledger.outstanding) +
          row("Not yet billed", ledger.unbilled);
      }

      function renderFindings(ledger) {
        if (!ledger) {
          $("findings").innerHTML =
            `<div class="empty">Nothing to reconcile yet.</div>`;
          return;
        }

        if (ledger.clean) {
          $("findings").innerHTML =
            `<div class="clean">The two halves of the ledger agree. Nothing to look at.</div>`;
          return;
        }

        $("findings").innerHTML = ledger.findings
          .map(
            (finding) => `
              <div class="finding ${esc(finding.severity)}">
                <div class="sev">${esc(finding.severity)}</div>
                ${esc(finding.message)}
              </div>
            `,
          )
          .join("");
      }

      function renderLedger(rows) {
        if (!rows?.length) {
          $("ledger").innerHTML =
            `<div class="empty">No ledger entries yet.</div>`;
          return;
        }

        $("ledger").innerHTML = `
          <table class="led">
            <thead>
              <tr>
                <th>Entry</th>
                <th>Source</th>
                <th>Date</th>
                <th style="text-align:right">Amount</th>
              </tr>
            </thead>

            <tbody>
              ${rows
                .map(
                  (row) => `
                    <tr>
                      <td>${esc(row.entryId)}</td>
                      <td class="src">${esc(row.source)}</td>
                      <td>${shortDate(row.dateIso)}</td>
                      <td class="amt">${formatRupees(row.amount)}</td>
                    </tr>
                  `,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function renderNextAction(d) {
        const n = d.next;
        if (!n) {
          $("next-wrap").innerHTML = "";
          return;
        }
        // The sent step has no form, because it writes one field. It gets a
        // button here rather than a page of its own.
        const link = n.href
          ? `<a href="${n.href}?pcode=${encodeURIComponent(d.pcode)}">${esc(n.label)}</a>`
          : n.forStep === "sent"
            ? `<a href="#" id="btn-sent">Mark as sent to the client</a>`
            : "";
        $("next-wrap").innerHTML = `
        <div class="next">
          <h2>Next</h2>
          <p>${esc(n.label)}${n.note ? ". " + esc(n.note) : ""}</p>
          ${link}
        </div>`;

        // Wired here rather than in load(), because the element only exists
        // once the markup above has been written.
        const btn = document.getElementById("btn-sent");
        if (btn) {
          btn.onclick = async (e) => {
            e.preventDefault();
            btn.textContent = "Recording...";
            try {
              await api.post("proposal/sent", { pcode: d.pcode });
              location.reload();
            } catch (err) {
              btn.textContent = err.message || "That did not work";
            }
          };
        }
      }
      async function loadProject() {
        const data = await api.get(
          "pipeline/project?pcode=" + encodeURIComponent(pcode),
        );

        $("h-pcode").textContent = data.pcode;
        $("h-name").textContent = data.projectName || "unnamed";

        $("h-sub").textContent =
          `${data.stage} for ${
            data.daysInStage === null ? "?" : data.daysInStage
          } days` + `  ·  ${data.status}  ·  ${data.owner || ""}`;

        renderRibbon(data.stages, data.stageIndex);
        renderSteps(data.steps || []);
        renderNextAction(data);
        renderMoney(data.ledger);
        renderFindings(data.ledger);
        renderLedger(data.ledgerRows);

        $("ids").innerHTML = `
          <dt>Proposal ID</dt>
          <dd>${esc(data.proposalId)}</dd>

          <dt>Client group</dt>
          <dd>${esc(data.group)}</dd>

          <dt>Customer</dt>
          <dd>${esc(data.customer)}</dd>

          <dt>Lead date</dt>
          <dd>${shortDate(data.leadDate)}</dd>

          <dt>Proposals</dt>
          <dd>${data.counts.proposals}</dd>

          <dt>Milestones</dt>
          <dd>${data.counts.milestones}</dd>
        `;

        $("loading").classList.add("hidden");
        $("content").classList.remove("hidden");
      }

      async function start() {
        if (!pcode) {
          $("loading").innerHTML =
            `No P-Code given. <a href="/">Back to the pipeline</a>.`;
          return;
        }

        await initAuth();

        if (!getAccount()) {
          $("loading").innerHTML = "You need to sign in. ";

          const button = document.createElement("button");
          button.textContent = "Sign in";
          button.onclick = () => signIn();

          $("loading").appendChild(button);
          return;
        }

        try {
          await loadProject();
        } catch (error) {
          $("loading").textContent =
            error.message || "The project could not be loaded.";
        }
      }

      start();
    </script>

    <script src="/lib/navigation.js"></script>
  </body>
</html>
